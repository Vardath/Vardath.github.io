name: Fix cosmology hero binary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cosmology-hero.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect saved hero fragments
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for d in ['assets/hero600','assets/hero600v2','assets/hero600v3','assets/hero_chunks']:
              print('\nDIR', d)
              for p in sorted(Path(d).glob('*.txt')):
                  s=p.read_text().strip()
                  bad=''.join(sorted(set(re.sub(r'[A-Za-z0-9+/=\\r\\n]','',s))))
                  print(p, 'len=',len(s),'head=',repr(s[:24]),'tail=',repr(s[-24:]),'bad=',repr(bad),'slash9j=',s.startswith('/9j/'),'padding=',s.endswith('='))
          PY
