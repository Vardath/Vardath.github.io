name: Reconstruct Original Language From All Dictionaries

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/reconstruct_original_language_all_dictionaries.py'
      - '.github/workflows/reconstruct-original-language-all-dictionaries.yml'

permissions:
  contents: write

jobs:
  reconstruct-all:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run every Wiktionary language dictionary through the man-grid reconstruction
        env:
          PYTHONUNBUFFERED: '1'
          MIN_FAMILIES: '3'
          MIN_LANGUAGES: '5'
          MAX_CONCEPTS: '12000'
        run: python tools/reconstruct_original_language_all_dictionaries.py
      - name: Commit complete reconstruction results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Vardath@users.noreply.github.com'
          git add data/phonetic-all-dictionaries-reconstruction.json data/phonetic-all-dictionaries-reconstruction.md data/phonetic-original-language-dictionary.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Add all-language full-dictionary man-grid reconstruction results'
            git pull --rebase origin main
            git push
          fi
