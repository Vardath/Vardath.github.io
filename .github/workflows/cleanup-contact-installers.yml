name: Cleanup contact installers
on:
  push:
    paths:
      - '.github/workflows/cleanup-contact-installers.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete one-shot contact workflows
        run: |
          rm -f .github/workflows/add-obfuscated-email-links.yml
          rm -f .github/workflows/install-contact-page.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m 'Remove obsolete contact installer workflows'
          git push
