name: Build named deity Art Archive supplement

on:
  push:
    paths:
      - 'tools/build_art_deity_supplement.py'
      - '.github/workflows/build-art-deity-supplement.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deity-supplement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build named deity supplement
        run: python tools/build_art_deity_supplement.py
      - name: Commit deity supplement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art.html cosmology_expansions/art_mythology/06-deity-named-supplement.txt research/art_deity_named_manifest.json
          if git diff --cached --quiet; then
            echo 'Deity supplement already current.'
            exit 0
          fi
          git commit -m 'Add named deity imagery across religions and mythologies'
          git pull --rebase origin main
          git push
