name: Test Cross Family Proto Meaning

on:
  push:
    paths:
      - 'tools/test_cross_family_proto_meaning.py'
      - '.github/workflows/test-cross-family-proto-meaning.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run cross-family proto meaning test
        run: python tools/test_cross_family_proto_meaning.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Vardath@users.noreply.github.com'
          git add data/phonetic-cross-family-proto-meaning.json data/phonetic-cross-family-proto-meaning.md
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Add cross-family proto-word meaning results'
            git pull --rebase origin main
            git push
          fi
