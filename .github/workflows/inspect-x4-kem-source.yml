name: Inspect Kuertee Emergent Missions source guards
on:
  push:
    paths:
      - 'downloads/x4-compatibility-fixes/tools/inspect_kem_source.py'
      - '.github/workflows/inspect-x4-kem-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'lxml>=5,<7'
      - name: Inspect pinned Workshop XML cue structure
        run: python downloads/x4-compatibility-fixes/tools/inspect_kem_source.py
      - name: Publish limited structural audit, no copied third-party source body
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/x4-compatibility-fixes/tools/kem_source_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Kuertee XML cue structure for compatibility guard review"
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
