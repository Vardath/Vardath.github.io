      - name: Require all 20 Test 2 shard results
        run: test "$(find data/man-grid-phonetic-locality-exact-v3-work -name 'result-*.json' | wc -l)" -eq 20
      - name: Deterministically merge Test 2
        run: python tools/test_man_grid_phonetic_locality_exact_v3.py merge
      - name: Validate corrected Test 2 result
        run: |
          python - <<'PY'
