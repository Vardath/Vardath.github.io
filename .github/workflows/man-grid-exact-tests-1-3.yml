          assert x['grid']['cells']==1074 and x['grid']['all_rectangles_mirrored'] is True
          print(json.dumps(x['summary'],ensure_ascii=False,indent=2))
          PY
      - name: Commit Test 2 as soon as complete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/man-grid-phonetic-locality-exact-v3.json
          git commit -m "Publish corrected exact Man Grid Test 2 result" || exit 0
          for n in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((n*5))
          done
