        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: exact-v3-prepared-${{ github.run_id }}
          path: data/man-grid-original-phonetics-exact-v3-work
      - uses: actions/download-artifact@v4
        with:
          pattern: exact-v3-t3-s*-${{ github.run_id }}
          path: data/man-grid-sibling-split-exact-v3-work
          merge-multiple: true
      - name: Require all 20 Test 3 shard results
        run: test "$(find data/man-grid-sibling-split-exact-v3-work -name 'result-*.json' | wc -l)" -eq 20
      - name: Deterministically merge Test 3
