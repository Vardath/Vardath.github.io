name: Generate WNG Steam media

on:
  push:
    paths:
      - '.github/workflows/wng-steam-media.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout WNG
        uses: actions/checkout@v4
        with:
          repository: Vardath/Wraith-Nanite-Gravtech-1.6
          ref: main
          path: wng

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Build Workshop support images
        shell: bash
        run: |
          cat > /tmp/make_media.py <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from pathlib import Path

          ROOT=Path("wng")
          OUT=Path("site/wng-steam")
          OUT.mkdir(parents=True,exist_ok=True)
          W,H=1200,675
          try:
              title_font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",42)
              sub_font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",22)
              label_font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",20)
          except:
              title_font=sub_font=label_font=ImageFont.load_default()

          def bg():
              im=Image.new("RGBA",(W,H),(7,12,18,255)); d=ImageDraw.Draw(im)
              for y in range(H):
                  t=y/H
                  c=(8+int(5*(1-t)),15+int(10*(1-t)),23+int(13*(1-t)),255)
                  d.line((0,y,W,y),fill=c)
              glow=Image.new("RGBA",(W,H),(0,0,0,0)); gd=ImageDraw.Draw(glow)
              gd.ellipse((-180,-180,520,520),fill=(50,160,200,45))
              gd.ellipse((760,160,1450,850),fill=(190,135,55,32))
              glow=glow.filter(ImageFilter.GaussianBlur(70))
              im=Image.alpha_composite(im,glow)
              d=ImageDraw.Draw(im)
              d.rounded_rectangle((22,22,W-22,H-22),radius=24,outline=(75,115,140,150),width=2)
              return im

          def load(rel): return Image.open(ROOT/rel).convert("RGBA")
          def fit(img,maxw,maxh):
              iw,ih=img.size; s=min(maxw/iw,maxh/ih)
              return img.resize((max(1,int(iw*s)),max(1,int(ih*s))),Image.Resampling.LANCZOS)
          def paste_center(canvas,img,box):
              x0,y0,x1,y1=box; img=fit(img,x1-x0,y1-y0)
              x=x0+(x1-x0-img.width)//2; y=y0+(y1-y0-img.height)//2
              a=img.getchannel("A")
              sh=a.filter(ImageFilter.GaussianBlur(8))
              black=Image.new("RGBA",img.size,(0,0,0,120)); black.putalpha(sh)
              canvas.alpha_composite(black,(x+8,y+10)); canvas.alpha_composite(img,(x,y))
          def title(canvas,t,sub=None):
              d=ImageDraw.Draw(canvas); d.text((50,40),t,font=title_font,fill=(235,246,252,255))
              if sub: d.text((52,94),sub,font=sub_font,fill=(155,184,201,255))
              d.line((50,130,1150,130),fill=(60,95,116,180),width=2)
          def label(canvas,xy,text):
              d=ImageDraw.Draw(canvas); x,y=xy
              box=d.textbbox((0,0),text,font=label_font); tw=box[2]-box[0]; th=box[3]-box[1]
              d.rounded_rectangle((x-12,y-8,x+tw+12,y+th+8),radius=10,fill=(4,9,14,205),outline=(65,112,140,190),width=1)
              d.text((x,y),text,font=label_font,fill=(215,236,247,255))
          def save(im,name): im.convert("RGB").save(OUT/name,quality=82,optimize=True,progressive=True)

          im=bg(); title(im,"Block Replicator Hierarchy","Drone  →  Hunter  →  Bulwark  →  Titan  →  Siege Mass")
          rels=[("Textures/Things/Pawn/Replicator/WNG_ReplicatorDrone.png","Drone"),("Textures/Things/Pawn/Replicator/WNG_ReplicatorHunter.png","Hunter"),("Textures/Things/Pawn/Replicator/WNG_ReplicatorBulwark.png","Bulwark"),("Textures/Things/Pawn/Replicator/WNG_ReplicatorTitan.png","Titan"),("Textures/Things/Pawn/Replicator/WNG_ReplicatorSiegeMass.png","Siege Mass")]
          xs=[55,270,485,700,915]
          for (rel,n),x in zip(rels,xs):
              paste_center(im,load(rel),(x,165,x+190,565)); label(im,(x+45,585),n)
          save(im,"01-replicator-hierarchy.jpg")

          im=bg(); title(im,"Wraith Living Technology","Organic craft and Odyssey-native gravship systems")
          paste_center(im,load("Textures/Things/Building/Wraith/Shuttle/WNG_WraithCruiser.png"),(40,150,720,615))
          small=[("Textures/Things/Building/Wraith/Gravship/WNG_OrganicPilotNode_south.png","Pilot Node"),("Textures/Things/Building/Wraith/Gravship/WNG_WraithFuelBladder_south.png","Fuel Bladder"),("Textures/Things/Building/Wraith/Gravship/WNG_OrganicThruster_south.png","Thruster")]
          for i,(rel,n) in enumerate(small):
              y=155+i*160; paste_center(im,load(rel),(760,y,1135,y+125)); label(im,(815,y+125),n)
          save(im,"02-wraith-living-tech.jpg")

          im=bg(); title(im,"Ancient / Asuran Technology","Puddle Jumper, shields, pattern systems and gravship controls")
          paste_center(im,load("Textures/Things/Building/Precursor/Shuttle/WNG_PuddleJumper.png"),(35,155,720,615))
          small=[("Textures/Things/Building/Precursor/Gravship/WNG_PrecursorPilotConsole_south.png","Pilot Console"),("Textures/Things/Building/Precursor/Shield/WNG_PrecursorSettlementShield.png","Settlement Shield"),("Textures/Things/Building/Precursor/Collective/WNG_AsuranPatternArchive_south.png","Pattern Archive")]
          for i,(rel,n) in enumerate(small):
              y=155+i*160; paste_center(im,load(rel),(760,y,1135,y+125)); label(im,(800,y+125),n)
          save(im,"03-ancient-asuran-tech.jpg")

          im=bg(); title(im,"Asuran Settlement Technology","Faction-specific furniture and control systems")
          items=[("Textures/Things/Building/Precursor/Furniture/WNG_PrecursorRestPlatform_south.png","Rest Platform"),("Textures/Things/Building/Precursor/Furniture/WNG_PrecursorFormChair_south.png","Form Chair"),("Textures/Things/Building/Precursor/Furniture/WNG_PrecursorTable.png","Table"),("Textures/Things/Building/Precursor/Gravship/WNG_PrecursorPilotConsole_south.png","Pilot Console")]
          for i,(rel,n) in enumerate(items):
              x=60+i*280; paste_center(im,load(rel),(x,170,x+240,535)); label(im,(x+45,565),n)
          save(im,"04-asuran-settlement.jpg")

          im=bg(); title(im,"Goa'uld Craft and Gravtech","Al'kesh, Death Glider, peltac and heavy plasma systems")
          paste_center(im,load("Textures/Things/Building/Goauld/Shuttle/WNG_AlkeshTransport.png"),(35,150,610,610)); label(im,(185,585),"Al'kesh")
          paste_center(im,load("Textures/Things/Building/Goauld/Shuttle/WNG_GoauldDeathGlider.png"),(610,155,920,440)); label(im,(690,430),"Death Glider")
          paste_center(im,load("Textures/Things/Building/Goauld/Gravship/WNG_GoauldPeltac_south.png"),(930,155,1145,360)); label(im,(955,350),"Peltac")
          paste_center(im,load("Textures/Things/Building/Goauld/Gravship/WNG_GoauldHeavyPlasmaBattery.png"),(900,395,1145,585)); label(im,(915,580),"Plasma Battery")
          save(im,"05-goauld-craft.jpg")

          im=bg(); title(im,"Wraith and Asuran Factions","Distinct pawn roles, armour and colony identities")
          chars=[("Textures/Things/Pawn/Humanlike/Apparel/Wraith/WNG_QueenRaiment_Female_south.png","Wraith Queen"),("Textures/Things/Pawn/Humanlike/Apparel/Wraith/WNG_CommanderCarapace_south.png","Wraith Commander"),("Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_HumanFormCombatArmor_Female.png","Asuran Soldier"),("Textures/Things/Pawn/Humanlike/Apparel/Precursor/WNG_PrecursorCommandArmor_Female_south.png","Asuran Command")]
          for i,(rel,n) in enumerate(chars):
              x=60+i*280; paste_center(im,load(rel),(x,165,x+240,545)); label(im,(x+35,570),n)
          save(im,"06-factions-and-characters.jpg")
          PY
          python /tmp/make_media.py

      - name: Commit media
        working-directory: site
        shell: bash
        run: |
          git config user.name "Vardath WNG Media"
          git config user.email "59270526+Vardath@users.noreply.github.com"
          git add wng-steam/*.jpg
          if git diff --cached --quiet; then
            echo "No media changes"
          else
            git commit -m "Add WNG Steam Workshop support images"
            git push
          fi
