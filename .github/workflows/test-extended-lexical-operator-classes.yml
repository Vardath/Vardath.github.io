name: Test Extended Lexical Operator Classes

on:
  push:
    paths:
      - 'tools/test_extended_lexical_operator_classes.py'
      - '.github/workflows/test-extended-lexical-operator-classes.yml'
      - 'data/phonetic-cross-family-proto-meaning.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run cached extended operator-class test
        run: python tools/test_extended_lexical_operator_classes.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Vardath@users.noreply.github.com'
          git add data/phonetic-extended-operator-classes.json data/phonetic-extended-operator-classes.md
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Add extended lexical operator-class results'
            git pull --rebase origin main
            git push
          fi
