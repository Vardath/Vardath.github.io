name: Test Proto Words Meaning

on:
  push:
    paths:
      - '.github/workflows/test-proto-words-meaning.yml'
      - 'tools/test_proto_words_meaning.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run proto-word meaning calibration
        run: python tools/test_proto_words_meaning.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Vardath@users.noreply.github.com'
          git add data/phonetic-proto-word-test.json data/phonetic-proto-word-test.md
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Add proto-word meaning phonetic test results'
            git pull --rebase origin main
            git push
          fi
