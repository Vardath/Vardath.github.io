name: Replace Vardath apocrypha selection

on:
  push:
    branches: [main]
    paths:
      - 'bible-staging/replace-vardath-apocrypha.trigger'

permissions:
  contents: write

concurrency:
  group: vardath-bible-maintenance
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace outgoing books and update lists
        shell: bash
        run: |
          set -euo pipefail

          expected_bible="16b65173a55077161e08ddadb62ec86a54f82285"
          current_bible="$(git rev-parse HEAD:book/VARDATH-BIBLE.md)"
          if [ "$current_bible" != "$expected_bible" ]; then
            echo "Manuscript blob mismatch: expected $expected_bible, current $current_bible."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          rules_path = Path("book/88.md")
          bible_path = Path("book/VARDATH-BIBLE.md")
          source_path = Path("book/source notes.md")

          rules = rules_path.read_text(encoding="utf-8")
          bible = bible_path.read_text(encoding="utf-8")
          source = source_path.read_text(encoding="utf-8")

          old6 = "6. Testament of Abraham"
          old7 = "7. Testaments of the Twelve Patriarchs"
          new6 = "6. 3 Baruch / Greek Apocalypse of Baruch"
          new7 = "7. 2 Baruch / Syriac Apocalypse of Baruch"

          if old6 not in rules or old7 not in rules:
              raise SystemExit("Expected outgoing entries are missing from book/88.md")
          rules = rules.replace(old6, new6, 1).replace(old7, new7, 1)

          if old6 not in bible or old7 not in bible:
              raise SystemExit("Expected outgoing entries are missing from Bible contents")
          bible = bible.replace(old6, new6, 1).replace(old7, new7, 1)

          bible = bible.replace(
              "Source, edition, translator and rights notes are maintained in `book/88.md`.",
              "Source, edition, translator and rights notes are maintained in `book/source notes.md`.",
              1,
          )

          start_marker = "\n# Book 6 — Testament of Abraham"
          stop_marker = "\n# Book 8 — Jubilees"
          start = bible.find(start_marker)
          stop = bible.find(stop_marker)
          if start < 0 or stop < 0 or stop <= start:
              raise SystemExit(f"Invalid manuscript removal boundaries: start={start}, stop={stop}")
          removed = bible[start:stop]
          if "# Book 7 — Testaments of the Twelve Patriarchs" not in removed:
              raise SystemExit("Book 7 was not inside the removal block")
          bible = bible[:start] + "\n" + bible[stop:]

          # Remove source-ledger sections for the outgoing books if they exist.
          source_pattern = re.compile(
              r"(?ms)^###\s+\d+\.\s+(?:Testament of Abraham|Testaments of the Twelve Patriarchs)\s*\n.*?(?=^###\s+\d+\.|\Z)"
          )
          source, removed_source_sections = source_pattern.subn("", source)

          checks = [
              ("88 new Book 6", new6 in rules),
              ("88 new Book 7", new7 in rules),
              ("Bible contents new Book 6", new6 in bible),
              ("Bible contents new Book 7", new7 in bible),
              ("old Book 6 body removed", "# Book 6 — Testament of Abraham" not in bible),
              ("old Book 7 body removed", "# Book 7 — Testaments of the Twelve Patriarchs" not in bible),
              ("Book 5 retained", "# Book 5 — Apocalypse of Abraham" in bible),
              ("Book 8 retained", "# Book 8 — Jubilees" in bible),
              ("source pointer corrected", "`book/source notes.md`" in bible),
          ]
          failed = [name for name, ok in checks if not ok]
          if failed:
              raise SystemExit("Validation failed: " + ", ".join(failed))

          rules_path.write_text(rules, encoding="utf-8")
          bible_path.write_text(bible, encoding="utf-8")
          if removed_source_sections:
              source_path.write_text(source, encoding="utf-8")

          print(f"Removed manuscript characters: {len(removed)}")
          print(f"Removed source-ledger sections: {removed_source_sections}")
          PY

          rm bible-staging/replace-vardath-apocrypha.trigger

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book/88.md book/VARDATH-BIBLE.md "book/source notes.md" bible-staging

          git diff --cached --check
          git commit -m "Replace two apocrypha in Vardath Bible"
          git push
