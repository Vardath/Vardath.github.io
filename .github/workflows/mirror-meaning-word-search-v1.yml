name: Mirror meaning word search

on:
  push:
    paths:
      - 'tools/test_mirror_meaning_word_search_v1.py'
      - '.github/workflows/mirror-meaning-word-search-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile tools/man_grid_exact_data.py tools/test_phonetic_feature_birth_v1.py tools/test_mirror_meaning_word_search_v1.py
      - name: Run mirror meaning search
        run: python tools/test_mirror_meaning_word_search_v1.py
      - name: Validate result
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/mirror-meaning-word-search-v1.json',encoding='utf8'))
          assert p['status']=='complete'
          assert p['coverage']['cross_family_pair_operator_candidates']>0
          assert p['selected']['holdout']['shared_concepts']>=40
          print(json.dumps(p['coverage'],ensure_ascii=False,indent=2))
          print(json.dumps(p['selected'],ensure_ascii=False,indent=2))
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Vardath@users.noreply.github.com'
          git add data/mirror-meaning-word-search-v1.json
          git commit -m 'Add mirror meaning word search results' || exit 0
          git pull --rebase origin main
          git push
