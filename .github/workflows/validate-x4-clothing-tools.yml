name: Validate X4 clothing mod build tools
on:
  push:
    paths:
      - 'downloads/x4-terran-pio-sleeveless/**'
      - '.github/workflows/validate-x4-clothing-tools.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile downloads/x4-terran-pio-sleeveless/tools/merge_replace_bodies.py downloads/x4-terran-pio-sleeveless/tools/audit_blend.py
      - run: python downloads/x4-terran-pio-sleeveless/tools/test_merge.py
