name: Apply static KA-BA-GE v2

on:
  push:
    paths:
      - 'tools/apply_static_kabage_once.py'
      - '.github/workflows/apply-static-kabage-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/apply_static_kabage_once.py
      - run: git diff --check
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add cosmology_fragments/f18.txt cosmology_expansions/x13.txt
          git commit -m "Make KA-BA-GE a separate static section"
          git push
