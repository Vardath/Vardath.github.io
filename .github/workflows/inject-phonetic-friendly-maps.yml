name: Inject Friendly Phonetic Maps

on:
  push:
    paths:
      - '.github/workflows/inject-phonetic-friendly-maps.yml'
      - 'phonetic-friendly-maps.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load friendly relationship and world maps
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('phonetic-bridge.html')
          s=p.read_text(encoding='utf-8')
          tag='<script defer src="phonetic-friendly-maps.js?v=20260905-friendly1"></script>'
          if tag not in s:
              s=s.replace('</head>',tag+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Vardath@users.noreply.github.com'
          git add phonetic-bridge.html
          if git diff --cached --quiet; then
            echo 'Page already up to date.'
          else
            git commit -m 'Add friendly phonetic relationship and world map sections'
            git pull --rebase origin main
            git push
          fi
