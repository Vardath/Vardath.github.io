name: Move ARK ARC SKY evidence boundary once
on:
  push:
    paths:
      - '.github/workflows/move-ark-arc-boundary-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/move_ark_arc_boundary_once.py
      - run: git diff --check
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add cosmology_fragments/f18.txt cosmology_expansions/assistant-notes.txt
          git commit -m "Move ARK ARC SKY evidence boundary to Assistant Notes"
          git push
