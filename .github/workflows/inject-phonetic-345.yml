name: Inject 3-4-5 Phonetic Codec

on:
  push:
    paths:
      - '.github/workflows/inject-phonetic-345.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject additive codec and guide scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('phonetic-bridge.html')
          s=p.read_text(encoding='utf-8')
          old='<script defer src="phonetic-345.js?v=20260905-pyramid1"></script>'
          tag='<script defer src="phonetic-345.js?v=20260905-pyramid2"></script>'
          guide='<script defer src="phonetic-guide.js?v=20260905-guide1"></script>'
          if old in s:
              s=s.replace(old,tag,1)
          elif tag not in s:
              s=s.replace('</head>',tag+'\n</head>',1)
          if guide not in s:
              s=s.replace('</head>',guide+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phonetic-bridge.html
          if git diff --cached --quiet; then
            echo 'Scripts already wired.'
          else
            git commit -m 'Load phonetic page tutorial and interaction guide'
            git pull --rebase origin main
            git push
          fi
