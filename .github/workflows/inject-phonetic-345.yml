name: Inject 3-4-5 Phonetic Codec

on:
  push:
    paths:
      - '.github/workflows/inject-phonetic-345.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject additive codec, guide, title, human UI, evidence lab, aggregate results, residual tools, and language atlas
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('phonetic-bridge.html')
          s=p.read_text(encoding='utf-8')
          old='<script defer src="phonetic-345.js?v=20260905-pyramid1"></script>'
          tag='<script defer src="phonetic-345.js?v=20260905-pyramid2"></script>'
          oldguide='<script defer src="phonetic-guide.js?v=20260905-guide1"></script>'
          guide='<script defer src="phonetic-guide.js?v=20260905-guide2"></script>'
          human='<script defer src="phonetic-345-human.js?v=20260905-human1"></script>'
          evidence='<script defer src="phonetic-pyramid-benchmark.js?v=20260905-evidence1"></script>'
          aggregate='<script defer src="phonetic-pyramid-aggregate.js?v=20260905-aggregate1"></script>'
          residual='<script defer src="phonetic-residual-codec.js?v=20260905-residual1"></script>'
          compression='<script defer src="phonetic-residual-compression.js?v=20260905-compress1"></script>'
          atlas='<script defer src="phonetic-language-atlas.js?v=20260905-atlas1"></script>'
          s=s.replace('<title>4×4 Phonetic Bridge Experiment — Vardath</title>','<title>The Three Square Pyramid Phonetic Bridge — Vardath</title>')
          s=s.replace('<h1>The 4×4 Phonetic Bridge</h1>','<h1>The Three Square Pyramid Phonetic Bridge</h1>')
          if old in s:
              s=s.replace(old,tag,1)
          elif tag not in s:
              s=s.replace('</head>',tag+'\n</head>',1)
          if oldguide in s:
              s=s.replace(oldguide,guide,1)
          elif guide not in s:
              s=s.replace('</head>',guide+'\n</head>',1)
          for x in (human,evidence,aggregate,residual,compression,atlas):
              if x not in s:s=s.replace('</head>',x+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Vardath@users.noreply.github.com'
          git add phonetic-bridge.html
          if git diff --cached --quiet; then
            echo 'Page already up to date.'
          else
            git commit -m 'Load language relationship atlas'
            git pull --rebase origin main
            git push
          fi
