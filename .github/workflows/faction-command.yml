name: Faction Command foundation
on:
  push:
    paths:
      - 'faction-command/**'
      - '.github/workflows/faction-command.yml'
  pull_request:
    paths:
      - 'faction-command/**'
      - '.github/workflows/faction-command.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the project and test harness
        run: |
          test -f faction-command/project.godot
          test -f faction-command/tests/run_tests.gd
      - name: Install Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
      - name: Import project and run foundation tests
        run: |
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path faction-command --editor --quit
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path faction-command --script res://tests/run_tests.gd
