name: Faction Command foundation
# Pass 32 final-head CI gate: household births, age cohorts, dependent-safe rescue and Android v21.
# Pass 32 final-head gate: verify all 1,603 Godot assertions and signed Android v21 after code, design, README and journal updates.
on:
  push:
    paths:
      - 'faction-command/**'
      - '.github/workflows/faction-command.yml'
  pull_request:
    paths:
      - 'faction-command/**'
      - '.github/workflows/faction-command.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Require the project and test harness
        run: |
          test -f faction-command/project.godot
          test -f faction-command/tests/run_tests.gd
      - name: Install Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
      - name: Import project and run foundation tests
        run: |
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path faction-command --editor --quit
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path faction-command --check-only --script res://tests/run_tests.gd
          timeout --signal=TERM --kill-after=5s 90s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path faction-command --script res://tests/run_tests.gd

  android-debug:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      XDG_CONFIG_HOME: /tmp/fc-godot-config
      XDG_DATA_HOME: /tmp/fc-godot-data
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/faction-command-debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: factioncommanddebug
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK tools
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          if [ ! -x "$ANDROID_HOME/build-tools/34.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;34.0.0"
          fi
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt"
      - name: Install matching Godot and Android export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64"
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$XDG_DATA_HOME/godot/export_templates/4.4.1.stable"
          unzip -j -q "$RUNNER_TEMP/templates.tpz" 'templates/android_debug.apk' 'templates/android_release.apk' -d "$XDG_DATA_HOME/godot/export_templates/4.4.1.stable"
      - name: Configure test signing and Godot
        run: |
          base64 --decode faction-command/build_support/public-debug.keystore.b64 > "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          keytool -list -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" -storepass android -alias factioncommanddebug > /dev/null
          mkdir -p "$XDG_CONFIG_HOME/godot"
          cat > "$XDG_CONFIG_HOME/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
      - name: Export Android debug APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/faction-command/build"
          "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --headless --path faction-command --editor --quit
          "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --headless --path faction-command --export-debug "Android Debug" "$GITHUB_WORKSPACE/faction-command/build/FactionCommand-debug.apk"
      - name: Verify package, architectures and signature
        run: |
          cd faction-command/build
          test -s FactionCommand-debug.apk
          unzip -tq FactionCommand-debug.apk
          unzip -p FactionCommand-debug.apk assets/data/starter_galaxy.json | cmp - ../data/starter_galaxy.json
          unzip -p FactionCommand-debug.apk assets/data/construction.json | cmp - ../data/construction.json
          unzip -p FactionCommand-debug.apk assets/data/ecology.json | cmp - ../data/ecology.json
          unzip -p FactionCommand-debug.apk assets/data/archives.json | cmp - ../data/archives.json
          unzip -p FactionCommand-debug.apk assets/data/research.json | cmp - ../data/research.json
          unzip -p FactionCommand-debug.apk assets/data/ship_hulls.json | cmp - ../data/ship_hulls.json
          unzip -l FactionCommand-debug.apk | grep -F 'assets/scripts/construction.gdc'
          unzip -l FactionCommand-debug.apk | grep -F 'assets/scripts/build_supply.gdc'
          unzip -l FactionCommand-debug.apk | grep -F 'assets/scripts/archives.gdc'
          unzip -l FactionCommand-debug.apk | grep -F 'assets/scripts/research.gdc'
          unzip -l FactionCommand-debug.apk | grep -F 'assets/scripts/station_supply.gdc'
          unzip -l FactionCommand-debug.apk | grep -F 'assets/scripts/shipyard.gdc'
          unzip -l FactionCommand-debug.apk | grep -F 'assets/scripts/personnel.gdc'
          unzip -l FactionCommand-debug.apk | grep -F 'assets/scripts/population.gdc'
          unzip -l FactionCommand-debug.apk | grep -F 'assets/scripts/habitation.gdc'
          unzip -l FactionCommand-debug.apk | grep -F 'assets/scripts/object_inspector.gdc'
          unzip -l FactionCommand-debug.apk | grep -F 'assets/scripts/provisions.gdc'
          unzip -l FactionCommand-debug.apk | grep -F 'assets/scripts/settlement.gdc'
          unzip -l FactionCommand-debug.apk | grep -F 'assets/scripts/ecology.gdc'
          unzip -l FactionCommand-debug.apk | grep -F 'assets/scripts/demographics.gdc'
          unzip -l FactionCommand-debug.apk | grep -F 'assets/data/provisions.json'
          unzip -l FactionCommand-debug.apk | grep -F 'assets/data/habitation.json'
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs FactionCommand-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging FactionCommand-debug.apk | tee package-info.txt
          grep -F "package: name='io.github.vardath.factioncommand.debug'" package-info.txt
          grep -F "versionCode='21'" package-info.txt
          grep -F "versionName='0.1.21-debug'" package-info.txt
          grep -F "'arm64-v8a'" package-info.txt
          grep -F "'armeabi-v7a'" package-info.txt
          sha256sum FactionCommand-debug.apk > FactionCommand-debug.apk.sha256
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: FactionCommand-Android-debug
          path: |
            faction-command/build/FactionCommand-debug.apk
            faction-command/build/FactionCommand-debug.apk.sha256
            faction-command/build/package-info.txt
          if-no-files-found: error
          retention-days: 30
