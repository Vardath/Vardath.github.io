name: Faction Command foundation
on:
  push:
    paths:
      - 'faction-command/**'
      - '.github/workflows/faction-command.yml'
  pull_request:
    paths:
      - 'faction-command/**'
      - '.github/workflows/faction-command.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate game project and run headless tests
        run: |
          if [ ! -f faction-command/project.godot ]; then
            echo "Game project not created yet; foundation workflow installed."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path faction-command --editor --quit
          if [ -f faction-command/tests/run_tests.gd ]; then
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path faction-command --script res://tests/run_tests.gd
          fi
