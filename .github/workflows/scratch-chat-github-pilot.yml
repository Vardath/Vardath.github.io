name: Scratch Chat GitHub text training pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-text-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Scratch-Chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Download and provenance-record GitHub corpus
        run: python -m capability.github_pilot --out data/github-pilot
      - name: Train from random initialization
        run: |
          python -m capability.modern_train train \
            --corpus data/github-pilot \
            --tokenizer data/github-pilot/tokenizer.json \
            --checkpoint checkpoints/github-pilot.pt \
            --steps 30 --width 64 --layers 2 --heads 4 \
            --context-size 128 --seq-len 64 --batch 2 \
            --grad-accum 1 --threads 2 --save-every 10 \
            --eval-every 10 --min-train-tokens 1000 \
            > github-pilot-train.json
      - name: Evaluate held-out splits
        run: |
          python -m capability.modern_train evaluate \
            --corpus data/github-pilot \
            --tokenizer data/github-pilot/tokenizer.json \
            --checkpoint checkpoints/github-pilot.pt \
            > github-pilot-evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: scratch-chat-github-pilot
          path: |
            Scratch-Chat/checkpoints/github-pilot.pt
            Scratch-Chat/data/github-pilot/tokenizer.json
            Scratch-Chat/data/github-pilot/source.json
            Scratch-Chat/github-pilot-train.json
            Scratch-Chat/github-pilot-evaluation.json
          retention-days: 30
