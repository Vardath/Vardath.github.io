name: Scratch Chat GitHub text training pilot

on:
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * *'
  push:
    branches: [main]
    paths:
      - 'Scratch-Chat/capability/github_pilot.py'
      - 'Scratch-Chat/capability/dialogue_corpus.py'
      - 'Scratch-Chat/tests/test_dialogue_corpus.py'
      - 'Scratch-Chat/capability/readiness_gate.py'
      - 'Scratch-Chat/tests/test_readiness_gate.py'
      - 'Scratch-Chat/capability/generation_probes.py'
      - 'Scratch-Chat/capability/probe_scoring.py'
      - 'Scratch-Chat/tests/test_probe_scoring.py'
      - 'Scratch-Chat/capability/deepthort_bridge.py'
      - 'Scratch-Chat/tests/test_deepthort_bridge.py'
      - '.github/workflows/scratch-chat-github-pilot.yml'

permissions:
  contents: write

concurrency:
  group: scratch-chat-pilot
  cancel-in-progress: false

jobs:
  github-text-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: Scratch-Chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Test DeepThorT integration bridge
        run: python -m unittest discover -s tests -p "test_deepthort_bridge.py" -v
      - name: Test scored generation diagnostics
        run: python -m unittest discover -s tests -p "test_probe_scoring.py" -v
      - name: Test fail-closed readiness gate
        run: python -m unittest discover -s tests -p "test_readiness_gate.py" -v
      - name: Test dialogue corpus provenance and leakage
        run: python -m unittest discover -s tests -p "test_dialogue_corpus.py" -v
      - name: Build original dialogue seed and validate split isolation
        run: |
          python -m capability.dialogue_corpus --out data/dialogue-seed > dialogue-seed-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('data/dialogue-seed')
          sets=[]
          for split in ('train','validation','test'):
              rows=[json.loads(x) for x in (d/(split+'.jsonl')).read_text().splitlines()]
              assert rows and all(isinstance(r['text'],str) and r['text'] for r in rows)
              sets.append({r['family'] for r in rows})
          assert not (sets[0]&sets[1] or sets[0]&sets[2] or sets[1]&sets[2])
          PY
      - name: Download and provenance-record GitHub corpus
        run: python -m capability.github_pilot --out data/github-pilot
      - name: Train from random initialization
        run: |
          python -m capability.modern_train train \
            --corpus data/github-pilot \
            --tokenizer data/github-pilot/tokenizer.json \
            --checkpoint checkpoints/github-pilot.pt \
            --steps 2700 --width 64 --layers 2 --heads 4 \
            --context-size 128 --seq-len 64 --batch 2 \
            --grad-accum 1 --threads 2 --save-every 50 \
            --eval-every 50 --min-train-tokens 1000 --quiet \
            > github-pilot-train.json
      - name: Evaluate held-out splits
        run: |
          python -m capability.modern_train evaluate \
            --corpus data/github-pilot \
            --tokenizer data/github-pilot/tokenizer.json \
            --checkpoint checkpoints/github-pilot.pt \
            > github-pilot-evaluation.json
      - name: Record qualitative conversation and multi-turn probes
        run: |
          python -m capability.generation_probes \
            --checkpoint checkpoints/github-pilot.pt \
            --tokenizer data/github-pilot/tokenizer.json \
            --output github-pilot-probes.json
      - name: Score generated answers against fixed development checks
        run: python -m capability.probe_scoring --probes github-pilot-probes.json --output github-pilot-probe-scores.json
      - name: Validate machine-readable training reports
        run: |
          python -m json.tool github-pilot-train.json > /dev/null
          python -m json.tool github-pilot-evaluation.json > /dev/null
          python -m json.tool github-pilot-probes.json > /dev/null
          python -m json.tool github-pilot-probe-scores.json > /dev/null
      - name: Assess conversational readiness without conflating language loss with dialogue ability
        run: python -m capability.readiness_gate --evaluation github-pilot-evaluation.json --probe-scores github-pilot-probe-scores.json --output github-pilot-readiness.json
      - name: Publish verified metrics to repository
        run: |
          mkdir -p training-results
          cp github-pilot-train.json training-results/github-pilot-train.json
          cp github-pilot-evaluation.json training-results/github-pilot-evaluation.json
          cp github-pilot-probes.json training-results/github-pilot-probes.json
          cp github-pilot-probe-scores.json training-results/github-pilot-probe-scores.json
          cp data/github-pilot/source.json training-results/github-pilot-source.json
          cp data/dialogue-seed/source.json training-results/dialogue-seed-source.json
          cp github-pilot-readiness.json training-results/github-pilot-readiness.json
          python -c 'import json,os,pathlib; e=json.loads(pathlib.Path("github-pilot-evaluation.json").read_text()); pathlib.Path("training-results/github-pilot-status.json").write_text(json.dumps({"run_id":os.environ["GITHUB_RUN_ID"],"commit":os.environ["GITHUB_SHA"],"state":"completed","checkpoint_artifact":"scratch-chat-github-pilot","evaluation":e},indent=2))'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Rebase the publication onto the latest main so concurrent commits do not discard results.
          # The output files are untracked by Git until staged; preserve them across fetch.
          cp -r training-results /tmp/scratch-chat-training-results
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p training-results
            cp /tmp/scratch-chat-training-results/* training-results/
            git add training-results/
            if git diff --cached --quiet; then
              echo "Training results already published"
              break
            fi
            git commit -m 'Record Scratch Chat GitHub pilot training results [skip ci]'
            if git push origin HEAD:main; then
              echo "Published training results"
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "Failed to publish results after five attempts" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: scratch-chat-github-pilot
          path: |
            Scratch-Chat/checkpoints/github-pilot.pt
            Scratch-Chat/data/github-pilot/tokenizer.json
            Scratch-Chat/data/github-pilot/source.json
            Scratch-Chat/data/dialogue-seed/
            Scratch-Chat/dialogue-seed-manifest.json
            Scratch-Chat/github-pilot-train.json
            Scratch-Chat/github-pilot-evaluation.json
            Scratch-Chat/github-pilot-probes.json
            Scratch-Chat/github-pilot-probe-scores.json
            Scratch-Chat/github-pilot-readiness.json
          retention-days: 30
