name: Fix cosmology research visibility once
on:
  push:
    paths: ['.github/workflows/fix-cosmology-visibility-once.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair anchors and contents
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cosmology_fragments/f18.txt')
          s=p.read_text()
          s=s.replace('<h2>Visual atlas — the geometry the test was asking about</h2>','<h2 id="masonic-alchemical-visual-atlas">Visual atlas — the geometry the test was asking about</h2>',1)
          s=s.replace('<h2>What the result adds to the model</h2>','<h2 id="masonic-alchemical-result-in-the-vardath-model">What the result adds to the model</h2>',1)
          p.write_text(s)
          p=Path('vardath-cosmology.html')
          s=p.read_text()
          s=s.replace('20260913-masonicart2','20260914-cosmology-visible1')
          s=s.replace("root.querySelectorAll(':scope > h1, .assistant-intro > h1')","root.querySelectorAll(':scope > h1, .late-research-block > h1, #ladder-as-lattice-the-masonic-sky-projection, .assistant-intro > h1')",1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit repair
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add cosmology_fragments/f18.txt vardath-cosmology.html
          git commit -m 'Expose latest cosmology art research on live page'
          git push
