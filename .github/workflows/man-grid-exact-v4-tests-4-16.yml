          path: data/man-grid-exact-v4-work/t13-result-*.json.gz
          retention-days: 7

  merge4:
    name: Merge Test 4 v4 — require all 20
    needs: t4_shards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {name: 'exact-v4-base-${{ github.run_id }}', path: data/man-grid-exact-v4-work}
      - uses: actions/download-artifact@v4
        with:
          pattern: exact-v4-t04-s*-${{ github.run_id }}
          path: data/man-grid-exact-v4-work
          merge-multiple: true
      - run: test "$(find data/man-grid-exact-v4-work -name 't04-result-*.json.gz' | wc -l)" -eq 20
      - run: python tools/man_grid_exact_v4.py merge --test 4
      - uses: actions/upload-artifact@v4
        with:
          name: exact-v4-t04-merged-${{ github.run_id }}
          path: data/man-grid-test-04-exact-v4.json
          retention-days: 7
      - name: Publish Test 4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/man-grid-test-04-exact-v4.json
          git commit -m "Publish exact-v4 Test 4 result" || exit 0
          for n in 1 2 3 4 5 6; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((n*5)); done
          exit 1

