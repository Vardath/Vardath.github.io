name: Package X4 Universal Cargo Teleport
on:
  push:
    paths:
      - '.github/workflows/package-x4-universal-cargo-teleport.yml'
      - 'downloads/x4-universal-cargo-teleport/vardath_universal_cargo_teleport/**'
      - 'downloads/x4-universal-cargo-teleport/package.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vardath-x4-universal-cargo-package
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Parse XML and package single extension
        run: python3 downloads/x4-universal-cargo-teleport/package.py
      - name: Publish ready-to-install ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/x4-universal-cargo-teleport/*_TEST.zip
          git diff --cached --quiet || git commit -m "Package X4 universal cargo teleport extension"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
