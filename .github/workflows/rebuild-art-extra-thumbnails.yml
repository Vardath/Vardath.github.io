name: Rebuild Art Archive extra thumbnails

on:
  push:
    branches: [main]
    paths:
      - 'research/lattice_art_corpus_results/2026-09-13_examples.csv'
      - 'tools/build_art_archive_from_test_corpus.py'

permissions:
  contents: write

jobs:
  rebuild-extra-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild image-bearing extra test archive
        run: python -c "from tools.build_art_archive_from_test_corpus import write_extra_test_archives; write_extra_test_archives()"
      - name: Commit rebuilt gallery include
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cosmology_expansions/art_corpus/00-extra-test-archives.txt
          if git diff --cached --quiet; then
            echo 'Extra gallery already current.'
            exit 0
          fi
          git commit -m 'Rebuild Art Archive extra thumbnails [skip ci]'
          git pull --rebase origin main
          git push
