name: Assemble Vardath Cosmology
# Reassemble after final index-note cleanup: 2026-09-19

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/assemble-book.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble canonical manuscript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          out = root / "book" / "BOOK.md"

          parts = [
              ("Part I — Finding the Hidden Shape", 1, 5),
              ("Part II — The Living World Structure", 6, 12),
              ("Part III — The Gate", 13, 20),
              ("Part IV — What Crosses", 21, 27),
              ("Part V — Mythology as Camera Angles", 28, 37),
              ("Part VI — Land, Sky and the Waking Environment", 38, 44),
              ("Part VII — Time, World Succession and the Moving Door", 45, 48),
              ("Part VIII — The Integrated Vardath Cosmology", 49, 52),
              ("Part IX — Ancient Cosmologies and Sacred Worlds", 53, 64),
              ("Part X — Worlds Above, Below and Before", 65, 76),
              ("Part XI — Fairy Doors, Time Slips and Modern Echoes", 77, 88),
          ]

          chunks = [
              "# Vardath Cosmology: The World That Opens\n\n"
              "## Stephen Michael Hawton / Vardath\n\n---\n\n"
          ]

          for p in [
              root / "book" / "chapters" / "00-preface.md",
              root / "book" / "chapters" / "00-introduction.md",
          ]:
              chunks.append(p.read_text(encoding="utf-8").rstrip() + "\n\n---\n\n")

          for part_title, start, end in parts:
              chunks.append(f"# {part_title}\n\n")
              for n in range(start, end + 1):
                  matches = sorted((root / "book" / "chapters").glob(f"{n:02d}-*.md"))
                  if len(matches) != 1:
                      raise SystemExit(f"Expected exactly one file for chapter {n}, found {len(matches)}: {matches}")
                  chunks.append(matches[0].read_text(encoding="utf-8").rstrip() + "\n\n---\n\n")

          chunks.append("# Appendices\n\n")
          for p in [
              root / "book" / "appendices" / "A-working-glossary.md",
              root / "book" / "appendices" / "B-research-journey.md",
              root / "book" / "appendices" / "C-motif-and-role-atlas.md",
              root / "book" / "appendices" / "D-source-traditions.md",
              root / "book" / "appendices" / "E-index.md",
          ]:
              chunks.append(p.read_text(encoding="utf-8").rstrip() + "\n\n---\n\n")

          text = "".join(chunks)
          chapter_numbers = [int(x) for x in re.findall(r"^# Chapter (\d+) — ", text, re.M)]
          expected = list(range(1, 89))
          if chapter_numbers != expected:
              raise SystemExit(f"Chapter order mismatch: {chapter_numbers}")

          out.write_text(text, encoding="utf-8")
          words = len(re.findall(r"\b\w[\w’'-]*\b", text, re.UNICODE))
          print(f"Assembled {out}: {words:,} words, {len(text):,} characters")
          PY

      - name: Commit assembled BOOK.md
        shell: bash
        run: |
          git config user.name "Vardath Book Assembler"
          git config user.email "actions@users.noreply.github.com"
          git add book/BOOK.md
          if ! git diff --cached --quiet; then
            git commit -m "Book: assemble canonical readable manuscript"
            git push
          fi

      - name: Upload assembled manuscript
        uses: actions/upload-artifact@v4
        with:
          name: vardath-cosmology-assembled
          path: book/BOOK.md
          if-no-files-found: error
