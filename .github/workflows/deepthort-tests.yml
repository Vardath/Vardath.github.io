name: DeepThorT tests
on:
  push:
    paths:
      - 'DeepThorT/**'
      - '.github/workflows/deepthort-tests.yml'
  pull_request:
    paths:
      - 'DeepThorT/**'
      - '.github/workflows/deepthort-tests.yml'
jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DeepThorT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tk and isolated test display
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Compile all Python and check both ONNX server scripts
        run: |
          python -m compileall -q .
          node --check inference_server.mjs
          node --check inference_worker.mjs
      - name: Verify v60 exact-source SHA-256 and pinned ONNX implementation
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root=Path.cwd()
          manifest=json.loads((root/'V60_SOURCE_SHA256.json').read_text('utf-8'))
          assert manifest['schema']=='deepthort-v60-source-digest-v1'
          for item in manifest['source_files']:
              target=root/item['path']
              if hashlib.sha256(target.read_bytes()).hexdigest()!=item['sha256']:
                  raise SystemExit('v60 source SHA mismatch: '+item['path'])
          pin_worker='a80bd59f17f8f453b57e5035798bfca1cf840d5ead2a87d81f462b5402fb353f'
          pin_server='525a2e49836036aa7fd6c3d0967500b18dd7a1653a3f39ac1d7a07f97405628b'
          for path,pinned in (('inference_worker.mjs',pin_worker),('inference_server.mjs',pin_server)):
              if hashlib.sha256((root/path).read_bytes()).hexdigest()!=pinned:
                  raise SystemExit('ONNX implementation changed without v60 review: '+path)
          print('Verified',len(manifest['source_files']),'changed/new sources and both pinned ONNX JavaScript programs')
          PY
      - name: Run all isolated Python and Tk regressions under Xvfb
        run: |
          python - <<'PY'
          import os,re,subprocess,sys
          from pathlib import Path
          root=Path.cwd()
          env=dict(os.environ)
          env['PYTHONPATH']=os.pathsep.join((str(root/'tests'),str(root)))
          modules=sorted((root/'tests').glob('test_*.py'))
          failures=[];count=0
          for file in modules:
              module='tests.'+file.stem
              print('Running',module,flush=True)
              result=subprocess.run(['xvfb-run','-a',sys.executable,'-m','unittest',module,'-q'],
                                    env=env,check=False,text=True,capture_output=True)
              print(result.stdout[-4000:]+result.stderr[-4000:],flush=True)
              count+=sum(map(int,re.findall(r'Ran (\d+) tests?',result.stderr)))
              if result.returncode:failures.append(module)
          print('Tests:',count,'Modules:',len(modules),'Failed:',failures,flush=True)
          if failures:sys.exit(1)
          PY
      - name: Package v60 source overlay only after successful tests
        run: |
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path.cwd()
          output=root/'DeepThorT_v60_SourceOverlay.zip'
          excluded={'.git','__pycache__','.pytest_cache','node_modules','models','state','cache','.venv','venv'}
          if (root/'DeepThorT.exe').exists():
              raise SystemExit('Original Windows executable must never be replaced by this source overlay')
          files=sorted((p for p in root.rglob('*') if p.is_file() and p!=output
              and not any(part in excluded for part in p.relative_to(root).parts)
              and not p.name.endswith('_OverlayManifest.json')
              and p.name not in ('_patch_v60.py','run_regression_v60.py')),
              key=lambda p:p.relative_to(root).as_posix())
          manifest={'release':'DeepThorT v60 independent X4 component assemblies',
                    'kind':'SOURCE OVERLAY: install over existing Windows installation',
                    'full_windows_installation':False,
                    'preserve_existing':['DeepThorT.exe','models','state','node_modules','reference','cache','user projects'],
                    'two_local_onnx_ports':[8765,8766],
                    'shared_job_cpu_ceiling_percent':30,
                    'shared_job_commit_ceiling_percent':30,
                    'windows_acceptance_required':True,
                    'file_count':len(files),
                    'files':[{'path':p.relative_to(root).as_posix(),
                              'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files]}
          with zipfile.ZipFile(output,'w',compression=zipfile.ZIP_DEFLATED) as archive:
              for p in files:archive.write(p,p.relative_to(root).as_posix())
              archive.writestr('DeepThorT_v60_OverlayManifest.json',json.dumps(manifest,indent=2,sort_keys=True))
          with zipfile.ZipFile(output) as archive:
              bad=archive.testzip()
              if bad:raise SystemExit('Overlay ZIP CRC failure: '+bad)
              if len(manifest['files'])!=manifest['file_count']:
                  raise SystemExit('Overlay manifest file count mismatch')
          print('Overlay',output.name,'bytes',output.stat().st_size,'sha256',
                hashlib.sha256(output.read_bytes()).hexdigest(),'source files',len(files),flush=True)
          PY
      - name: Upload DeepThorT v60 source overlay
        uses: actions/upload-artifact@v4
        with:
          name: DeepThorT-v60-source-overlay
          path: DeepThorT/DeepThorT_v60_SourceOverlay.zip
          if-no-files-found: error
          retention-days: 90
