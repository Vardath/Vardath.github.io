name: DeepThorT tests
on:
  push:
    paths:
      - 'DeepThorT/**'
      - '.github/workflows/deepthort-tests.yml'
  pull_request:
    paths:
      - 'DeepThorT/**'
      - '.github/workflows/deepthort-tests.yml'
jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DeepThorT
    steps:
      - uses: actions/checkout@v4
      - name: Install headless display and matching system Python Tk bindings
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Compile Python sources
        run: /usr/bin/python3 -m compileall -q .
      - name: Run regression tests under Xvfb
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -q
