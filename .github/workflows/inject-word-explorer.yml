name: Inject Word Explorer

on:
  push:
    paths:
      - 'phonetic-word-explorer.js'
      - 'data/phonetic-word-explorer-seed.json'
      - '.github/workflows/inject-word-explorer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject compact Word Explorer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('phonetic-bridge.html')
          s=p.read_text(encoding='utf-8')
          tag='<script defer src="phonetic-word-explorer.js?v=20260905-wordexplorer1"></script>'
          if tag not in s:
              s=s.replace('</head>',tag+'\n</head>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phonetic-bridge.html
          git commit -m "Add compact Word Explorer to phonetic page"
          git push
