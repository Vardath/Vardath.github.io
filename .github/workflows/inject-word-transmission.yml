name: Inject Word Transmission Test
on:
  push:
    paths:
      - 'phonetic-word-transmission.js'
      - 'data/word-transmission-pilot.json'
      - '.github/workflows/inject-word-transmission.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject word test script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('phonetic-bridge.html')
          s=p.read_text()
          tag='<script defer src="phonetic-word-transmission.js?v=20260905-word1"></script>'
          if tag not in s:
              s=s.replace('</head>', tag+'\n</head>')
              p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phonetic-bridge.html
          git diff --cached --quiet || git commit -m "Wire word transmission test into phonetic page"
          git push
