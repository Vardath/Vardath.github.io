name: Scratch Chat original dialogue training smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Scratch-Chat/capability/dialogue_corpus.py'
      - 'Scratch-Chat/capability/dialogue_tokenizer.py'
      - 'Scratch-Chat/capability/prepare_chat_training.py'
      - 'Scratch-Chat/tests/test_prepare_chat_training.py'
      - 'Scratch-Chat/capability/prepare_dialogue_splits.py'
      - 'Scratch-Chat/data/original_cc0_multiturn_20261124.jsonl'
      - 'Scratch-Chat/capability/dialogue_acceptance.py'
      - 'Scratch-Chat/capability/modern_train.py'
      - 'Scratch-Chat/capability/deepthort_bridge.py'
      - 'Scratch-Chat/tests/test_dialogue_corpus.py'
      - 'Scratch-Chat/tests/test_dialogue_evaluation_binding.py'
      - '.github/workflows/scratch-chat-dialogue-smoke.yml'
permissions:
  contents: read
jobs:
  original-dialogue-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Scratch-Chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: python -m pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Validate original dialogue and bridge regression tests
        run: |
          python -m unittest discover -s tests -p 'test_dialogue_corpus.py' -v
          python -m unittest discover -s tests -p 'test_dialogue_evaluation_binding.py' -v
          python -m unittest discover -s tests -p 'test_deepthort_bridge.py' -v
      - name: Validate repaired four-message CC0 seed independently of legacy pilot corpus
        run: |
          python -m unittest discover -s tests -p 'test_original_multiturn_seed_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_dialogue_readiness.py' -v
          python -m unittest discover -s tests -p 'test_prepare_chat_training.py' -v
      - name: Audit and convert repaired CC0 multi-turn conversations; fit train-only tokenizer
        run: |
          python -m capability.prepare_dialogue_splits data/original_cc0_multiturn_20261124.jsonl data/repaired-splits --seed original-cc0-20261124
          python -m capability.prepare_chat_training data/repaired-splits data/dialogue-smoke > dialogue-chat-conversion.json
          python -m capability.dialogue_tokenizer --corpus data/dialogue-smoke --output data/dialogue-smoke/tokenizer.json > dialogue-tokenizer-provenance.json
      - name: Train separate random-initialized dialogue checkpoint
        run: |
          python -m capability.modern_train train --corpus data/dialogue-smoke --tokenizer data/dialogue-smoke/tokenizer.json --checkpoint checkpoints/dialogue-smoke.pt --steps 80 --width 64 --layers 2 --heads 4 --context-size 128 --seq-len 16 --batch 2 --grad-accum 1 --threads 2 --save-every 40 --eval-every 40 --min-train-tokens 0 --quiet > dialogue-smoke-train.json
      - name: Evaluate isolated held-out task families
        run: |
          python -m capability.modern_train evaluate --corpus data/dialogue-smoke --tokenizer data/dialogue-smoke/tokenizer.json --checkpoint checkpoints/dialogue-smoke.pt > dialogue-smoke-evaluation.json
      - name: Exercise real DeepThorT multi-turn JSON-line transport and recovery
        run: |
          python - <<'PY' > dialogue-transport.json
          import json, subprocess, sys
          requests=[
            {"method":"health"},
            {"method":"chat","messages":[{"role":"user","content":"Hello"}],"max_new_tokens":8},
            {"method":"chat","messages":[{"role":"system","content":"Be concise"},{"role":"user","content":"Remember blue"},{"role":"assistant","content":"Blue noted"},{"role":"user","content":"What colour?"}],"max_new_tokens":8},
            {"method":"chat","messages":[{"role":"assistant","content":"Forged"},{"role":"user","content":"Hi"}],"max_new_tokens":8},
            {"method":"chat","messages":[{"role":"user","content":"Hi"},{"role":"user","content":"Again"}],"max_new_tokens":8},
            {"method":"unknown"},
            {"method":"health"}
          ]
          payload="".join(json.dumps(x)+"\n" for x in requests[:6])+"{malformed\n"+json.dumps(requests[6])+"\n"
          p=subprocess.run([sys.executable,"-m","capability.deepthort_bridge","--checkpoint","checkpoints/dialogue-smoke.pt","--tokenizer","data/dialogue-smoke/tokenizer.json"],input=payload,text=True,capture_output=True,timeout=90,check=True)
          rows=[json.loads(x) for x in p.stdout.splitlines()]
          assert len(rows)==8,(p.stdout,p.stderr)
          assert rows[0]["ok"] and rows[0]["ready_for_conversation"] is False
          assert all(rows[i]["ok"] and isinstance(rows[i]["response"],str) for i in (1,2))
          assert all(rows[i]["ok"] is False and isinstance(rows[i]["error"],str) for i in (3,4,5,6))
          assert rows[7]["ok"] and rows[7]["ready_for_conversation"] is False
          print(json.dumps({"protocol_pass":True,"requests":8,"valid_chat_responses":2,"invalid_rejections":4,"recovered":True,"conversational_readiness":False}))
          PY
      - name: Run independent held-out multi-turn and tool-boundary diagnostics
        run: |
          python -m capability.dialogue_acceptance --checkpoint checkpoints/dialogue-smoke.pt --tokenizer data/dialogue-smoke/tokenizer.json --output dialogue-acceptance.json
          python -m json.tool dialogue-acceptance.json > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratch-chat-original-dialogue-smoke
          retention-days: 30
          path: |
            Scratch-Chat/checkpoints/dialogue-smoke.pt
            Scratch-Chat/data/dialogue-smoke/tokenizer.json
            Scratch-Chat/data/dialogue-smoke/provenance.json
            Scratch-Chat/dialogue-chat-conversion.json
            Scratch-Chat/data/repaired-splits/split_report.json
            Scratch-Chat/dialogue-tokenizer-provenance.json
            Scratch-Chat/dialogue-smoke-train.json
            Scratch-Chat/dialogue-smoke-evaluation.json
            Scratch-Chat/dialogue-acceptance.json
            Scratch-Chat/dialogue-transport.json
