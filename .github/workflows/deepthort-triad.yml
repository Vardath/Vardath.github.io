name: DeepThorT Triad source tests
on:
  push:
    paths:
      - 'DeepThorT-Triad/**'
      - '.github/workflows/deepthort-triad.yml'
  pull_request:
    paths:
      - 'DeepThorT-Triad/**'
      - '.github/workflows/deepthort-triad.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DeepThorT-Triad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -p test_triad_resident.py -v
      - run: python -m unittest discover -s tests -p test_triad_collaboration.py -v
      - run: python -m unittest discover -s tests -p test_triad_inference_recovery.py -v
      - run: python -m unittest discover -s tests -p test_triad_native_memory.py -v
      - run: python -m unittest discover -s tests -p test_shared_cap_35.py -v
      - run: python -m unittest discover -s tests -p test_production_review_v11.py -v
      - run: python -m unittest discover -s tests -p test_specification_guard_v61.py -v
      - run: python -m unittest discover -s tests -p test_reviewed_generation_v61.py -v
      - run: python -m unittest discover -s tests -p test_task_memory_v13.py -v
      - run: python -m unittest discover -s tests -p test_task_memory_v14.py -v
      - run: python -m unittest discover -s tests -p test_memory_governor_v21.py -v
      - run: python -m unittest discover -s tests -p test_live_memory_v22.py -v
      - run: python -m unittest discover -s tests -p test_job_queue.py -v
      - run: python -m unittest discover -s tests -p test_workflow_skills_v61.py -v
      - run: python -m unittest discover -s tests -p test_portable_skills_v15.py -v
      - run: python -m unittest discover -s tests -p test_portable_procedures_v16.py -v
      - run: python -m unittest discover -s tests -p test_action_guards_v16_1.py -v
      - run: python -m unittest discover -s tests -p test_local_mcp_v17.py -v
      - run: python -m unittest discover -s tests -p test_mcp_calls_v18.py -v
      - run: python -m unittest discover -s tests -p test_task_mcp_v19.py -v
      - run: python -m unittest discover -s tests -p test_mcp_stdio_v20.py -v
      - run: python -m unittest discover -s tests -p test_workflow_design_v61.py -v
      - run: python -m unittest discover -s tests -p test_application_workflow_v27.py -v
      - run: python -m unittest discover -s tests -p test_local_speech_v28.py -v
      - run: python -m unittest discover -s tests -p test_video_visuals_v29.py -v
      - name: Provision FFmpeg for actual render test
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: python -m unittest discover -s tests -p test_video_render_v30.py -v
      - run: python -m unittest discover -s tests -p test_workflow_acquisition_v61.py -v
      - run: python -m unittest discover -s tests -p test_chat_capabilities.py -v
      - run: python -m unittest discover -s tests -p test_chat_agent.py -v
      - run: python -m unittest discover -s tests -p test_residency_wait.py -v
      - run: python -m unittest discover -s tests -p test_multimedia_install.py -v
      - run: python -m unittest discover -s tests -p test_multimedia_core_probe.py -v
      - run: python -m unittest discover -s tests -p test_creative_core_v34.py -v
      - run: python -m unittest discover -s tests -p test_memory_core_v35.py -v
      - run: python -m unittest discover -s tests -p test_memory_observer_v36.py -v
