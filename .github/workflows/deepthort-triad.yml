name: DeepThorT Triad source tests
on:
  push:
    paths:
      - 'DeepThorT-Triad/**'
      - '.github/workflows/deepthort-triad.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DeepThorT-Triad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -p test_triad_resident.py -v
      - run: python -m unittest discover -s tests -p test_triad_collaboration.py -v
      - run: python -m unittest discover -s tests -p test_triad_inference_recovery.py -v
      - run: python -m unittest discover -s tests -p test_triad_native_memory.py -v
      - run: python -m unittest discover -s tests -p test_shared_cap_35.py -v
      - run: python -m unittest discover -s tests -p test_production_review_v11.py -v
      - run: python -m unittest discover -s tests -p test_specification_guard_v61.py -v
      - run: python -m unittest discover -s tests -p test_reviewed_generation_v61.py -v
      - run: python -m unittest discover -s tests -p test_task_memory_v13.py -v
      - run: python -m unittest discover -s tests -p test_task_memory_v14.py -v
      - run: python -m unittest discover -s tests -p test_job_queue.py -v
      - run: python -m unittest discover -s tests -p test_workflow_skills_v61.py -v
      - run: python -m unittest discover -s tests -p test_portable_skills_v15.py -v
      - run: python -m unittest discover -s tests -p test_portable_procedures_v16.py -v
      - run: python -m unittest discover -s tests -p test_action_guards_v16_1.py -v
      - run: python -m unittest discover -s tests -p test_local_mcp_v17.py -v
      - run: python -m unittest discover -s tests -p test_workflow_design_v61.py -v
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: DeepThorT-Triad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Windows file identity and portable procedures
        run: |
          python -m unittest discover -s tests -p test_action_guards_v16_1.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_portable_procedures_v16.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows local MCP discovery
        run: |
          python -m unittest discover -s tests -p test_local_mcp_v17.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned native runtime in isolated venv
        run: |
          python -m venv runtime/openvino-env
          & runtime/openvino-env/Scripts/python.exe -m pip --isolated install --only-binary=:all: --index-url https://pypi.org/simple openvino-genai==2026.4.1.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise real native OpenVINO CPU inside shared and nested jobs
        run: |
          & runtime/openvino-env/Scripts/python.exe triad_runtime_preflight.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triad-native-preflight
          path: DeepThorT-Triad/state/logs/triad-ci-native-preflight.log
          if-no-files-found: warn
