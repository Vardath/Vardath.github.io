name: DeepThorT Triad source tests
on:
  push:
    paths:
      - 'DeepThorT-Triad/**'
      - '.github/workflows/deepthort-triad.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DeepThorT-Triad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -p test_triad_resident.py -v
