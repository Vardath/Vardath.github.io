          python -m unittest discover -s tests -p test_reactive_interface_v42.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_task_graph_v42.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_project_assignments_v43.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
