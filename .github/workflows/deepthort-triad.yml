      - run: python -m unittest discover -s tests -p test_cross_project_memory_v69.py -v
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: DeepThorT-Triad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Windows file identity and portable procedures
        run: |
          python -m unittest discover -s tests -p test_action_guards_v16_1.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_portable_procedures_v16.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows local MCP discovery
        run: |
          python -m unittest discover -s tests -p test_local_mcp_v17.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_mcp_calls_v18.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_task_mcp_v19.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows governed memory
        run: |
          python -m unittest discover -s tests -p test_memory_governor_v21.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_live_memory_v22.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Application planning and acquisition
        run: |
          python -m unittest discover -s tests -p test_application_workflow_v27.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_workflow_acquisition_v61.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Local speech synthesis
        run: |
          python -m unittest discover -s tests -p test_local_speech_v28.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python speech_preflight.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Scene visual assets
        run: |
          python -m unittest discover -s tests -p test_video_visuals_v29.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python visual_preflight.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provision FFmpeg for native render test
        run: |
          if (!(Get-Command ffmpeg.exe -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:Path = "$env:ChocolateyInstall\bin;$env:Path"
            "$env:ChocolateyInstall\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual capped MP4 render
        run: |
          python -m unittest discover -s tests -p test_video_render_v30.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python render_preflight.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Supervised Windows stdio MCP lifecycle
        run: |
          python -m unittest discover -s tests -p test_mcp_stdio_v20.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python mcp_stdio_preflight.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Conversational capability and fourth-core regressions
