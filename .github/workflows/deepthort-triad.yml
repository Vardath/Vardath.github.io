      - run: python -m unittest discover -s tests -p test_team_delegation_v40.py -v
      - run: python -m unittest discover -s tests -p test_janus_recursive_societies.py -v
      - run: python -m unittest discover -s tests -p test_society_workflow_v41.py -v
      - run: python -m unittest discover -s tests -p test_reactive_interface_v42.py -v
      - run: python -m unittest discover -s tests -p test_task_graph_v42.py -v
      - run: python -m unittest discover -s tests -p test_project_assignments_v43.py -v
      - run: python -m unittest discover -s tests -p test_ready_roles_v44.py -v
      - run: python -m unittest discover -s tests -p test_project_midi_v45.py -v
      - run: python -m unittest discover -s tests -p test_adaptive_dispatch_v46.py -v
      - run: python -m unittest discover -s tests -p test_memory_duty_v47.py -v
