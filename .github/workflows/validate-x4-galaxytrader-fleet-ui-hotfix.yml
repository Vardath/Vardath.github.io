name: Validate GalaxyTrader Fleet UI table hotfix
on:
  push:
    paths:
      - 'downloads/x4-galaxytrader-fleet-ui-hotfix/**'
      - '.github/workflows/validate-x4-galaxytrader-fleet-ui-hotfix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Verify GalaxyTrader UI Lua source syntax
        run: luac5.1 -p downloads/x4-galaxytrader-fleet-ui-hotfix/patches/gt_fleet_view.lua
      - name: Validate patch contracts and build exact installation ZIP
        run: python downloads/x4-galaxytrader-fleet-ui-hotfix/tools/package.py
      - name: Publish validated ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/x4-galaxytrader-fleet-ui-hotfix/GT_Fleet_UI_Hotfix_1.0.zip
          if ! git diff --cached --quiet; then
            git commit -m "Package GalaxyTrader Fleet UI hotfix"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
