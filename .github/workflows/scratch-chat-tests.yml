name: Scratch Chat source tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'Scratch-Chat/**'
      - '.github/workflows/scratch-chat-tests.yml'
  pull_request:
    paths:
      - 'Scratch-Chat/**'
      - '.github/workflows/scratch-chat-tests.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Scratch-Chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: Scratch-Chat/requirements.txt
      - name: Install CPU PyTorch
        run: python -m pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Compile source before running tests
        run: python -m compileall -q capability vardath_chat
      - name: Run checkpoint-independent dialogue and protocol tests
        run: |
          python - <<'PY'
          import subprocess, sys
          patterns = [
              'test_dialogue*.py',
              'test_assistant_termination_training.py',
              'test_dialogue_admission_index.py',
              'test_import_dolly_candidate.py',
              'test_audit_near_duplicates.py',
              'test_prepare_dialogue_splits.py',
              'test_immutable_dialogue_splits.py',
              'test_independent_acceptance.py',
              'test_deepthort_jsonl_transport.py',
              'test_deepthort_bridge.py',
              'test_readiness_gate.py',
              'test_probe_scoring.py',
              'test_pilot_artifact_hashes.py',
              'test_answer_leakage_audit.py',
              'test_capacity_plan.py',
              'test_source_snapshot.py',
              'test_original_multiturn_seed_pipeline.py',
          ]
          failed = []
          for pattern in patterns:
              print(f"::group::Scratch Chat {pattern}", flush=True)
              result = subprocess.run([sys.executable, '-m', 'unittest', 'discover',
                                       '-s', 'tests', '-p', pattern, '-v'], check=False)
              print('::endgroup::', flush=True)
              if result.returncode:
                  print(f"::error title=Scratch Chat test failure::{pattern} exited {result.returncode}", flush=True)
                  failed.append(pattern)
          if failed:
              print("Failing suites: " + ", ".join(failed), flush=True)
              sys.exit(1)
          PY
      # Legacy full-suite tests require additional optional packages and a locally
      # trained starter.pt checkpoint; do not report them as passing in this job.
      # Run those separately with explicit fixtures before promoting readiness.
      - name: Check Python source compiles
        run: python -m compileall -q capability vardath_chat
