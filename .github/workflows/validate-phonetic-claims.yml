name: Validate Phonetic Claims

on:
  push:
    paths:
      - 'tools/validate_phonetic_claims.py'
      - '.github/workflows/validate-phonetic-claims.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone representative aligned LibriSpeech sample
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/MontrealCorpusTools/aligned-librispeech.git /tmp/aligned-librispeech
          cd /tmp/aligned-librispeech
          git sparse-checkout set \
            librispeech_aligned/1089 \
            librispeech_aligned/121 \
            librispeech_aligned/1221 \
            librispeech_aligned/237 \
            librispeech_aligned/2830 \
            librispeech_aligned/3570
      - name: Run controlled validation suite
        env:
          ALIGNED_LIBRISPEECH: /tmp/aligned-librispeech/librispeech_aligned
          SPEECH_TEXTGRID_CAP: '2500'
        run: python tools/validate_phonetic_claims.py
      - name: Commit validation results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/phonetic-validation-results.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish controlled phonetic validation results'
            git push
          fi
