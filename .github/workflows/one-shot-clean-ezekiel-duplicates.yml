name: One-shot clean duplicate Ezekiel research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-clean-ezekiel-duplicates.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicate appended tail
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("book/EXTRA-RESEARCH.md")
          text = path.read_text(encoding="utf-8")
          marker = "# SECTION 53 progress B2A — Ezekiel 21–24"
          count = text.count(marker)
          if count != 1:
              raise SystemExit(f"Expected exactly one uppercase duplicate marker, found {count}")
          cut = text.index(marker)
          while cut > 0 and text[cut-1] == "\n":
              cut -= 1
          path.write_text(text[:cut].rstrip() + "\n", encoding="utf-8")
          PY

          rm .github/workflows/one-shot-clean-ezekiel-duplicates.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book/EXTRA-RESEARCH.md .github/workflows/one-shot-clean-ezekiel-duplicates.yml
          git commit -m "Remove duplicate Ezekiel research tail"
          git push
