## DELTA 2 — 2026 critical-source update for Ezekiel 29–32

A current scholarly control was added during this re-check:

**Meike J. Röhrig, _Die Ägyptenworte im Ezechielbuch: Eine literarhistorische und religionsgeschichtliche Analyse von Ez 29–32_ (Mohr Siebeck, 2026), 348 pp., Open Access, CC BY-SA 4.0.**

DOI:
https://doi.org/10.1628/978-3-16-200201-3

Publisher page:
https://www.mohrsiebeck.com/en/book/die-aegyptenworte-im-ezechielbuch-9783162002013/

Röhrig's analysis is useful to this project because it explicitly treats the Egypt material as a layered textual complex and distinguishes units including:

- Ezekiel 29:1–16;
- 29:17–21;
- 30:1–19;
- 30:20–26;
- 31;
- 32:1–16;
- 32:17–32.

Her literary-historical method combines text-critical and redaction-critical analysis and reconstructs development from earlier 7th–6th century material through later scribal additions into the Hellenistic period.

### Method consequence for the Vardath timeline

The existing rule is strengthened:

**received literary order**
≠ automatically
**dated event order**
≠ automatically
**one original compositional layer**.

Therefore the final transformation timeline should preserve:
- local oracle/unit boundaries;
- explicit dates;
- received book order;
- major textual witnesses;
- and only then compare process sequences across units.

This is especially important for Ezekiel 29:17–21, whose 27th-year date interrupts the surrounding chronological progression.

