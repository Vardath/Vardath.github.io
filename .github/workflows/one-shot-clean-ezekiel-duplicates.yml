name: One-shot clean duplicate Ezekiel research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-clean-ezekiel-duplicates.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicate tail and keep only new delta
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("book/EXTRA-RESEARCH.md")
          text = path.read_text(encoding="utf-8")
          marker = "# SECTION 53 progress B2A — Ezekiel 21–24"
          count = text.count(marker)
          if count != 1:
              raise SystemExit(f"Expected exactly one duplicate marker, found {count}")

          cut = text.index(marker)
          while cut > 0 and text[cut-1] == "\n":
              cut -= 1

          delta = r'''

---

# 2026-09-25 DELTA — duplicate-aware additions to Ezekiel 21–32
## Preserve only what today's re-check added beyond the already-complete live research

A live-tail audit during continuation showed that the previous research session had already completed:

- Ezekiel 21–24;
- Ezekiel 25–28;
- Ezekiel 29–32;
- SECTION 53B2 integration;
- Ezekiel 33–36;
- Ezekiel 37;
- Ezekiel 38–39;
- SECTION 53C2 integration.

The three large 2026-09-25 restatement blocks for Ezekiel 21–32 were therefore removed rather than retained as duplicate research.

Only genuinely additive observations from the re-check are preserved below.

---

## DELTA 1 — Ezekiel 23:14–17 adds a representation → orientation → message → physical-arrival chain

The earlier Ezekiel 23 work correctly preserved:

**two related city-systems**
→ branch 1 fails
→ branch 2 observes
→ branch 2 takes the same route.

One additional process in 23:14–17 is worth recording separately.

Sequence:

**figures/images of Chaldeans represented on a wall**
→ Oholibah sees the representation
→ desire/orientation changes
→ messengers are sent to the distant represented people
→ the Babylonians physically come to her.

### Information-system significance

This creates a clean distinction among:

1. **representation / encoded image**;
2. **receiver perception**;
3. **internal orientation change**;
4. **outgoing message**;
5. **distant physical response/arrival**.

For the Vardath process model this reinforces a recurring rule:

> **information can change later material routing before physical coupling occurs.**

This belongs beside:
- Ezekiel 21's decision at the road fork;
- Ezekiel 24's survivor/report channel;
- Ezekiel 33's watchman/signal system.

### Control

Ezekiel 23 explicitly presents Samaria/Jerusalem through sexualized political allegory.

The information-chain abstraction is useful;
the gendered/sexual violence must not be converted into physical cosmology.

Primary:
- Ezekiel 23:14–17 NRSVUE:
  https://www.biblegateway.com/passage/?search=Ezekiel+23%3A14-17&version=NRSVUE

