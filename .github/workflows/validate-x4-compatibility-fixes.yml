name: Validate X4 compatibility fixes
on:
  push:
    paths:
      - 'downloads/x4-compatibility-fixes/**'
      - '.github/workflows/validate-x4-compatibility-fixes.yml'
  pull_request:
    paths:
      - 'downloads/x4-compatibility-fixes/**'
      - '.github/workflows/validate-x4-compatibility-fixes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'lxml>=5,<7'
      - name: Build versioned ZIP from verified pinned sources
        run: python downloads/x4-compatibility-fixes/tools/package.py
      - name: Verify pinned sources, native diffs, failure boundaries and installed ZIP
        run: python downloads/x4-compatibility-fixes/tools/validate.py --zip downloads/x4-compatibility-fixes/Vardath_Compatibility_Fixes_1.0.2.zip --report /tmp/x4-compatibility-static-results.json
      - name: Publish validated installable archive
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/x4-compatibility-fixes/Vardath_Compatibility_Fixes_1.0.2.zip downloads/x4-compatibility-fixes/STATIC_TEST_RESULTS.json
          if ! git diff --cached --quiet; then
            git commit -m "Package X4 Compatibility Fixes 1.0.2"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: X4-compatibility-static-validation
          path: /tmp/x4-compatibility-static-results.json
