name: Validate X4 compatibility fixes
on:
  push:
    paths:
      - 'downloads/x4-compatibility-fixes/**'
      - '.github/workflows/validate-x4-compatibility-fixes.yml'
  pull_request:
    paths:
      - 'downloads/x4-compatibility-fixes/**'
      - '.github/workflows/validate-x4-compatibility-fixes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'lxml>=5,<7'
      - name: Verify pinned sources, native diffs, failure boundaries and installed ZIP
        run: python downloads/x4-compatibility-fixes/tools/validate.py --zip downloads/x4-compatibility-fixes/Vardath_Compatibility_Fixes_1.0.1.zip --report /tmp/x4-compatibility-static-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: X4-compatibility-static-validation
          path: /tmp/x4-compatibility-static-results.json
