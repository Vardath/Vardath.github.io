name: Linked three-way language traversal search

on:
  push:
    paths:
      - 'tools/test_three_way_linked_languages_v1.py'
      - '.github/workflows/three-way-linked-language-test-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile test
        run: python -m py_compile tools/man_grid_exact_data.py tools/test_man_grid_alphabet_traversal_v1.py tools/test_three_way_linked_languages_v1.py
      - name: Run linked-trio search
        run: python tools/test_three_way_linked_languages_v1.py
      - name: Validate result
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/three-way-linked-language-test-v1.json',encoding='utf8'))
          assert p['status']=='complete'
          assert p['coverage']['candidate_triples']>0
          assert set(p['selected_trio']['languages'])=={'LR','RL','TB'}
          print(json.dumps(p['coverage'],indent=2))
          print(json.dumps(p['selected_trio'],indent=2))
          PY
      - name: Commit reproducible result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Vardath@users.noreply.github.com'
          git pull --rebase origin main
          git add data/three-way-linked-language-test-v1.json
          if git diff --cached --quiet; then
            echo 'No result changes.'
          else
            git commit -m 'Add linked three-way language test results'
            git push
          fi
