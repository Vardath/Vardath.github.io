name: Build full Art Archive from preserved test corpus

on:
  push:
    paths:
      - '.github/workflows/build-art-archive-from-test-corpus.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-art-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download preserved Masonic/alchemical result artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, urllib.request, zipfile, io, pathlib
          repo = 'Vardath/Vardath.github.io'
          artifact_id = 10318026684
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip',
              headers={
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'vardath-art-archive-builder'
              }
          )
          payload = urllib.request.urlopen(req, timeout=120).read()
          out = pathlib.Path('/tmp/vardath-art-corpus')
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              z.extractall(out)
          print('artifact bytes', len(payload))
          print('shards', len(list((out/'shards').glob('*.json'))))
          PY

      - name: Generate static source-linked corpus gallery
        run: |
          python - <<'PY'
          import csv, glob, html, json, pathlib, re
          from collections import Counter, defaultdict

          ROOT = pathlib.Path('.')
          ART = pathlib.Path('/tmp/vardath-art-corpus')
          OUT = ROOT / 'cosmology_expansions' / 'art_corpus'
          OUT.mkdir(parents=True, exist_ok=True)

          records=[]
          for p in sorted((ART/'shards').glob('*.json')):
              data=json.loads(p.read_text(encoding='utf-8'))
              records.extend(data.get('records',[]))

          # Preserve the corpus as actually used in the test. Only records with a recorded image/cover
          # can appear visually. Dedupe repeated discoveries by source URL, not by title.
          unique={}
          for r in records:
              image=(r.get('image_url') or '').strip()
              url=(r.get('url') or '').strip()
              if not image or not url:
                  continue
              key=url
              if key not in unique:
                  unique[key]=r
          records=list(unique.values())

          def safe(s):
              # Escape HTML and Liquid delimiters so source titles cannot be interpreted by Jekyll.
              s=html.escape(str(s or ''), quote=True)
              return s.replace('{','&#123;').replace('}','&#125;')

          def card(r):
              title=safe(r.get('title') or 'Untitled record')
              url=safe(r.get('url'))
              image=safe(r.get('image_url'))
              tradition=safe((r.get('tradition') or '').title())
              cohort=safe((r.get('cohort') or '').title())
              source=safe(r.get('source') or r.get('channel') or '')
              year=r.get('year')
              yearpart=f' · {safe(year)}' if year not in (None,'') else ''
              fam=r.get('family_count')
              fampart=f' · {safe(fam)} motif famil{ "y" if fam==1 else "ies" }' if isinstance(fam,int) and fam else ''
              return (f'<a class="corpus-card" href="{url}" target="_blank" rel="noopener noreferrer" '
                      f'data-tradition="{tradition.lower()}" data-cohort="{cohort.lower()}" data-source="{source.lower()}">'
                      f'<img loading="lazy" decoding="async" src="{image}" alt="{title}">'
                      f'<span><b>{title}</b><small>{tradition} · {cohort} · {source}{yearpart}{fampart}</small></span></a>')

          groups=defaultdict(list)
          for r in records:
              groups[(r.get('tradition','unknown'),r.get('cohort','unknown'),r.get('channel','unknown'))].append(r)
          for vals in groups.values():
              vals.sort(key=lambda r: (r.get('year') is None, r.get('year') or 99999, (r.get('title') or '').lower()))

          order=[
            ('masonic','target','commons'),('masonic','target','openlibrary'),
            ('alchemy','target','commons'),('alchemy','target','openlibrary'),
            ('masonic','control','commons'),('masonic','control','openlibrary'),
            ('alchemy','control','commons'),('alchemy','control','openlibrary')]
          labels={
            ('masonic','target','commons'):'Masonic target — Wikimedia Commons visual records',
            ('masonic','target','openlibrary'):'Masonic target — Open Library covers/documents',
            ('alchemy','target','commons'):'Alchemical target — Wikimedia Commons visual records',
            ('alchemy','target','openlibrary'):'Alchemical target — Open Library covers/documents',
            ('masonic','control','commons'):'Masonic controls — Wikimedia Commons visual records',
            ('masonic','control','openlibrary'):'Masonic controls — Open Library covers/documents',
            ('alchemy','control','commons'):'Alchemical controls — Wikimedia Commons visual records',
            ('alchemy','control','openlibrary'):'Alchemical controls — Open Library covers/documents'}

          includes=[]
          for idx,key in enumerate(order,1):
              vals=groups.get(key,[])
              slug='-'.join(key)
              fn=OUT/f'{idx:02d}-{slug}.txt'
              is_control=key[1]=='control'
              intro=('These are comparison/control images scored by the same frozen test. They are retained so the visual archive shows what the target corpus was compared with, not only the attractive matches.' if is_control else
                     'These are target-corpus images actually gathered and scored by the frozen Masonic/alchemical test, including zero-feature and weak-feature records as well as stronger matches.')
              body=[f'<details class="corpus-section" id="corpus-{slug}" {"" if is_control else "open"}>',
                    f'<summary><strong>{safe(labels[key])}</strong><span>{len(vals):,} source-linked images</span></summary>',
                    f'<p class="corpus-note">{safe(intro)}</p>',
                    '<div class="corpus-grid">']
              body.extend(card(r) for r in vals)
              body.extend(['</div>','</details>'])
              fn.write_text('\n'.join(body)+'\n',encoding='utf-8')
              includes.append((key,fn,len(vals)))

          # Add smaller image-bearing result sets from other tests that were previously buried in CSVs.
          extra=[]
          ladder=ROOT/'research/masonic_ladder_sky_v2_results/examples.csv'
          if ladder.exists():
              rows=list(csv.DictReader(ladder.open(encoding='utf-8')))
              rows=[r for r in rows if r.get('image_url') and r.get('url')]
              e=['<details class="corpus-section" id="ladder-sky-v2" open>',
                 f'<summary><strong>Earlier Masonic ladder / sky visual test</strong><span>{len(rows):,} saved examples</span></summary>',
                 '<p class="corpus-note">Image-bearing examples retained from the earlier ladder/sky test output. These are shown as test archaeology, not as a replacement for the later broader corpus.</p>',
                 '<div class="corpus-grid">']
              for r in rows:
                  pseudo={'title':r.get('title'),'url':r.get('url'),'image_url':r.get('image_url'),'tradition':'masonic ladder/sky','cohort':'saved example','source':'Wikimedia Commons','year':r.get('year'),'family_count':None}
                  e.append(card(pseudo))
              e+=['</div>','</details>']
              extra.append('\n'.join(e))

          # Lattice-art saved examples do not consistently contain image URLs in the CSV; the source-linked
          # visual atlas already on art.html remains the rendered visual set. Preserve the records themselves
          # here as a compact source index, linked to museum pages.
          lattice=ROOT/'research/lattice_art_corpus_results/2026-09-13_examples.csv'
          if lattice.exists():
              rows=list(csv.DictReader(lattice.open(encoding='utf-8')))
              e=['<details class="corpus-section source-index" id="lattice-art-saved-records" open>',
                 f'<summary><strong>Lattice-art corpus — additional saved scored records</strong><span>{len(rows):,} museum records</span></summary>',
                 '<p class="corpus-note">Additional scored museum records saved by the lattice-art test. The main visual atlas above carries the records for which stable thumbnail URLs were assembled; these links retain the wider saved example set.</p>',
                 '<div class="source-chip-grid">']
              for r in rows:
                  title=safe(r.get('title')); url=safe(r.get('url')); culture=safe(r.get('culture_group')); motifs=safe(r.get('motifs'))
                  e.append(f'<a class="source-chip" href="{url}" target="_blank" rel="noopener noreferrer"><b>{title}</b><small>{culture} · {motifs}</small></a>')
              e+=['</div>','</details>']
              extra.append('\n'.join(e))
          (OUT/'00-extra-test-archives.txt').write_text('\n'.join(extra)+'\n',encoding='utf-8')

          counts=Counter((r.get('channel') for r in records))
          target=sum(1 for r in records if r.get('cohort')=='target')
          control=sum(1 for r in records if r.get('cohort')=='control')
          intro=f'''<section class="gallery-section corpus-intro" id="full-test-corpus-archive">
          <h2>Full scored visual test corpus — not just the showcase hits</h2>
          <p>The original Art Archive showed only a small set of illustrative hits. The preserved 20-shard Masonic/alchemical test actually gathered thousands of image-bearing records. This expansion restores that hidden visual corpus as a source-linked archive rather than selecting only images that resemble the model.</p>
          <div class="corpus-stats"><div><b>{len(records):,}</b><span>unique image-bearing scored records</span></div><div><b>{target:,}</b><span>target-corpus images</span></div><div><b>{control:,}</b><span>control images</span></div><div><b>{counts.get('commons',0):,}</b><span>Wikimedia Commons records</span></div><div><b>{counts.get('openlibrary',0):,}</b><span>Open Library covers</span></div></div>
          <p class="corpus-note"><strong>Archive rule:</strong> being present here means the record was gathered and scored in the test; it does not mean it was a positive motif hit. Target, control, weak, null and noisy records are deliberately retained so the page represents the research corpus rather than a curated confirmation gallery.</p>
          <nav class="corpus-jumps">'''
          for key,fn,n in includes:
              slug='-'.join(key)
              intro += f'<a href="#corpus-{slug}">{safe(labels[key])} ({n:,})</a>'
          intro += '<a href="#ladder-sky-v2">Ladder/sky test archaeology</a><a href="#lattice-art-saved-records">Lattice-art saved records</a></nav></section>'
          (OUT/'00-corpus-intro.txt').write_text(intro+'\n',encoding='utf-8')

          # Machine-readable provenance manifest for future rebuilding / auditing.
          manifest=ROOT/'research'/'art_archive_masonic_alchemy_visual_manifest.csv'
          fields=['source','channel','tradition','cohort','id','title','url','image_url','year','query','family_count']
          with manifest.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader()
              for r in sorted(records,key=lambda r:(r.get('tradition',''),r.get('cohort',''),r.get('channel',''),r.get('title',''))):
                  w.writerow({k:r.get(k) for k in fields})

          # Wire static build-time includes into art.html exactly once.
          art=ROOT/'art.html'
          s=art.read_text(encoding='utf-8')
          marker='<!-- FULL_TEST_CORPUS_ARCHIVE -->'
          if marker not in s:
              block='\n'+marker+'\n{% include_relative cosmology_expansions/art_corpus/00-corpus-intro.txt %}\n{% include_relative cosmology_expansions/art_corpus/00-extra-test-archives.txt %}\n'
              for key,fn,n in includes:
                  block += '{% include_relative '+str(fn).replace('\\','/')+' %}\n'
              s=s.replace('</main>',block+'</main>',1)

          # Dense archive styling: existing contextual galleries stay large; thousands of test cards become
          # a lighter thumbnail grid. No JavaScript is required for the archive to exist or be browsable.
          css='''\n.corpus-intro{border-color:#4b4772;background:linear-gradient(180deg,#17162a,#10131d)}
          .corpus-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:18px 0}.corpus-stats div{padding:12px;background:#0d121a;border:1px solid var(--line);border-radius:10px;text-align:center}.corpus-stats b{display:block;color:var(--cyan);font-size:1.35rem}.corpus-stats span{display:block;color:var(--muted);font-size:.78rem}.corpus-jumps{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.corpus-jumps a{font-size:.78rem;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:#111724}.corpus-section{margin:18px 0;border:1px solid #2d3850;border-radius:13px;background:#0c1119;overflow:hidden}.corpus-section>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 17px;background:#121826}.corpus-section>summary::-webkit-details-marker{display:none}.corpus-section>summary strong{color:#f0f7ff}.corpus-section>summary span{color:var(--cyan);font-size:.82rem;white-space:nowrap}.corpus-note{padding:0 17px;color:var(--muted);font-size:.86rem}.corpus-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;padding:10px}.corpus-card{display:flex;flex-direction:column;min-width:0;background:#111620;border:1px solid #252e40;border-radius:8px;overflow:hidden;color:var(--text);text-decoration:none}.corpus-card:hover{border-color:var(--cyan)}.corpus-card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#070a0f}.corpus-card span{padding:7px;min-width:0}.corpus-card b{display:block;font-size:.72rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.corpus-card small{display:block;color:var(--muted);font-size:.62rem;line-height:1.3;margin-top:3px}.source-chip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:7px;padding:10px}.source-chip{padding:9px;background:#111620;border:1px solid #252e40;border-radius:8px;text-decoration:none;color:var(--text)}.source-chip b{display:block;font-size:.76rem}.source-chip small{display:block;color:var(--muted);font-size:.65rem;margin-top:3px}@media(max-width:760px){.corpus-stats{grid-template-columns:repeat(2,1fr)}.corpus-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}\n'''
          if '.corpus-intro{' not in s:
              s=s.replace('</style>',css+'</style>',1)
          art.write_text(s,encoding='utf-8')

          print('raw records',len(records))
          print('target',target,'control',control,'commons',counts.get('commons',0),'openlibrary',counts.get('openlibrary',0))
          for key,fn,n in includes: print(fn,n)
          PY

      - name: Commit expanded archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art.html cosmology_expansions/art_corpus research/art_archive_masonic_alchemy_visual_manifest.csv
          if git diff --cached --quiet; then
            echo 'Archive already current.'
            exit 0
          fi
          git commit -m 'Expand Art Archive with full scored visual test corpus'
          git pull --rebase origin main
          git push
