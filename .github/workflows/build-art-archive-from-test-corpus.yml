name: Build full Art Archive from preserved test corpus

on:
  push:
    paths:
      - '.github/workflows/build-art-archive-from-test-corpus.yml'
      - 'tools/build_art_archive_from_test_corpus.py'
      - 'research/lattice_art_corpus_results/2026-09-13_examples.csv'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-art-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download preserved Masonic/alchemical result artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import io
          import os
          import pathlib
          import urllib.request
          import zipfile

          repo = 'Vardath/Vardath.github.io'
          artifact_id = 10318026684
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip',
              headers={
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'vardath-art-archive-builder',
              },
          )
          payload = urllib.request.urlopen(req, timeout=120).read()
          out = pathlib.Path('/tmp/vardath-art-corpus')
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              archive.extractall(out)
          print('artifact bytes', len(payload))
          print('shards', len(list((out / 'shards').glob('*.json'))))
          PY

      - name: Generate static source-linked corpus gallery
        run: python tools/build_art_archive_from_test_corpus.py

      - name: Commit expanded archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art.html cosmology_expansions/art_corpus research/art_archive_masonic_alchemy_visual_manifest.csv
          if git diff --cached --quiet; then
            echo 'Archive already current.'
            exit 0
          fi
          git commit -m 'Expand Art Archive with full scored visual test corpus [skip ci]'
          git pull --rebase origin main
          git push
