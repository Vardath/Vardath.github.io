name: Build full Art Archive from preserved test corpus

on:
  push:
    paths:
      - '.github/workflows/build-art-archive-from-test-corpus.yml'
      - 'tools/build_art_archive_from_test_corpus.py'
      - 'research/lattice_art_corpus_results/2026-09-13_examples.csv'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-art-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download preserved Masonic/alchemical result artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/vardath-art-corpus /tmp/vardath-art-corpus.zip
          mkdir -p /tmp/vardath-art-corpus
          # Use GitHub CLI rather than urllib here. GitHub serves artifact ZIPs through a
          # signed cross-host redirect; gh handles that redirect without leaking the
          # GitHub Authorization header to blob storage.
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10318026684/zip" \
            > /tmp/vardath-art-corpus.zip
          unzip -q /tmp/vardath-art-corpus.zip -d /tmp/vardath-art-corpus
          echo "artifact bytes $(wc -c < /tmp/vardath-art-corpus.zip)"
          echo "shards $(find /tmp/vardath-art-corpus/shards -name '*.json' -type f | wc -l)"

      - name: Generate static source-linked corpus gallery
        run: python tools/build_art_archive_from_test_corpus.py

      - name: Commit expanded archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art.html cosmology_expansions/art_corpus research/art_archive_masonic_alchemy_visual_manifest.csv
          if git diff --cached --quiet; then
            echo 'Archive already current.'
            exit 0
          fi
          git commit -m 'Expand Art Archive with full scored visual test corpus [skip ci]'
          git pull --rebase origin main
          git push
