name: Abraham Brahma mirror test

on:
  push:
    paths:
      - 'tools/test_abraham_brahma_mirror_v1.py'
      - '.github/workflows/abraham-brahma-mirror-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile tools/man_grid_exact_data.py tools/test_phonetic_feature_birth_v1.py tools/test_abraham_brahma_mirror_v1.py
      - name: Run focused mirror test
        run: python tools/test_abraham_brahma_mirror_v1.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/abraham-brahma-mirror-test-v1.json',encoding='utf8'))
          assert p['status']=='complete'
          assert len(p['results'])==4
          assert p['coverage']['nulls_per_candidate']>=10000
          print(json.dumps(p,ensure_ascii=False,indent=2))
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Vardath@users.noreply.github.com'
          git add data/abraham-brahma-mirror-test-v1.json
          git commit -m 'Add Abraham Brahma mirror test results' || exit 0
          git pull --rebase origin main
          git push
