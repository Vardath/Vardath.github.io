name: Inject Phonetic No Autoscroll

on:
  push:
    paths:
      - 'phonetic-no-autoscroll.js'
      - '.github/workflows/inject-phonetic-no-autoscroll.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject no-autoscroll script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('phonetic-bridge.html')
          s=p.read_text(encoding='utf-8')
          tag='<script defer src="phonetic-no-autoscroll.js?v=20260905-scroll1"></script>'
          if tag not in s:
              s=s.replace('</head>',tag+'\n</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Vardath@users.noreply.github.com'
          git add phonetic-bridge.html
          if git diff --cached --quiet; then
            echo 'Already wired.'
          else
            git commit -m 'Keep phonetic page at top on load'
            git pull --rebase origin main
            git push
          fi
