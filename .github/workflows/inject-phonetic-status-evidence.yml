name: Inject Phonetic Status Evidence
on:
  push:
    paths:
      - 'phonetic-status-evidence.js'
      - '.github/workflows/inject-phonetic-status-evidence.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject status evidence script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('phonetic-bridge.html')
          s=p.read_text(encoding='utf-8')
          tag='<script defer src="phonetic-status-evidence.js?v=20260905-status1"></script>'
          if tag not in s:
              s=s.replace('</head>',tag+'\n</head>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add phonetic-bridge.html
          git commit -m 'Show supported phonetic findings in status table'
          git push
