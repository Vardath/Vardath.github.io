name: Apply static KA-BA-GE section once

on:
  push:
    paths:
      - '.github/workflows/static-kabage-section-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write KA-BA-GE as plain static HTML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Remove the dynamically inserted/nested KA-BA-GE block from x13.
          x13 = Path('cosmology_expansions/x13.txt')
          xs = x13.read_text(encoding='utf-8')
          nested = '\n\n<div class="deepening late-research-block" data-after="ladder-as-lattice-the-masonic-sky-projection">'
          if nested in xs:
              xs = xs.split(nested, 1)[0].rstrip() + '\n'
              x13.write_text(xs, encoding='utf-8')

          # Put the section directly in the base fragment, after the whole
          # Freemason/Ladder block has closed. Plain HTML, no insertion anchor.
          f18 = Path('cosmology_fragments/f18.txt')
          s = f18.read_text(encoding='utf-8')
          section_id = 'born-of-the-ka-ba-ge-cabbage-lettuce-lattice-and-the-field-of-eyes'
          if f'id="{section_id}"' not in s:
              marker = '</div>\n<p><strong>Assistant note — Freemason/alchemical corpus test:</strong>'
              if marker not in s:
                  raise SystemExit('Static insertion point not found in f18.txt')
              section = r'''
<section class="deepening late-research-block">
<h1 id="born-of-the-ka-ba-ge-cabbage-lettuce-lattice-and-the-field-of-eyes">Born of the KA–BA–GE — cabbage, lettuce, lattice and the field of eyes</h1>
<p>A new phonetic-symbolic chain appeared out of the three-shell work:</p>
<blockquote><strong>KA + BA + GE → cabbage → lettuce → lattice → “lot of eyes.”</strong></blockquote>
<p>In the Vardath reading, the chain compresses several layers of the cosmology into one piece of language. <strong>KA</strong> is taken as the animating or vital principle, <strong>BA</strong> as the individuated or mobile being, and <strong>GE</strong> as the earth/material world. Read together as <strong>KA–BA–GE</strong>, the phrase becomes a symbolic formula for life becoming embodied in matter.</p>
<p>The next step is visual rather than merely verbal. A cabbage or lettuce head is a living structure produced by repeated growth around a centre. Leaves layer over one another, turn around the growth point and build a bounded body from a continuing generative pattern. In that sense the plant is a small biological analogue of the shell model: <strong>centre → repeated turning → layered enclosure → living body</strong>.</p>
<div class="projection-grid"><div><b>KA–BA–GE</b><span>life · individuated being · earth / matter</span></div><div><b>cabbage / lettuce</b><span>living layered growth turning around a centre</span></div><div><b>lattice / “lot of eyes”</b><span>the repeated framework, openings and nodes on which growth can organise</span></div></div>

<h2>KA–BA–GE Patch Kids</h2>
<p>The phrase <strong>Cabbage Patch Kids</strong> tightens the chain further. Heard through the same symbolic lens, it becomes <strong>KA–BA–GE Patch Kids</strong>: children or beings arising from a local patch of the KA–BA–GE.</p>
<p><strong>Patch</strong> matters because it is also a geometric word. A patch is a bounded local region of a larger surface or field. In the three-shell model, a world need not be generated everywhere at once; a local patch of the larger lattice can become active, gather matter, turn, layer and produce a bounded living form.</p>
<blockquote><strong>whole lattice → local patch → eye / node / gate → turning growth → body / child</strong></blockquote>
<p>That gives the phrase a compact internal reading: <strong>KA–BA–GE PATCH KIDS = beings born from local living patches of the lattice.</strong> The commercial mythology happens to lean into the same vocabulary of birth and patch: the official Cabbage Patch Kids material describes Kids as being born in the Cabbage Patch at BabyLand General Hospital, with birth certificates and adoption papers. In this cosmology that is treated as a modern symbolic echo, not as the historical source of the model.</p>

<h2>Picture references — growth body and “Patch Kid”</h2>
<p class="art-source-note">These are source-linked reference images, used the same way as the other visual-atlas cards on this page: one shows the physical layered cabbage geometry; the other is an actual historical Cabbage Patch Kids object. Click either card for its source record.</p>
<div class="art-gallery story-art-gallery">
<a class="art-card" href="https://commons.wikimedia.org/wiki/File:Cabbage_(121282608).jpg" target="_blank" rel="noopener noreferrer"><img loading="lazy" src="https://commons.wikimedia.org/wiki/Special:FilePath/Cabbage_(121282608).jpg?width=720" alt="Cut head of cabbage showing layered leaf structure"><span class="art-copy"><strong>Cut cabbage — layered growth around a centre</strong><small>Jeremy Noble · 2006 · Wikimedia Commons</small><em>The cut head makes the repeated folding, enclosure and centre-outward layering visible rather than leaving “cabbage” as a word-only analogy.</em></span></a>
<a class="art-card" href="https://commons.wikimedia.org/wiki/File:Cabbage_Patch_Baby_Boy_Doll_-_DPLA_-_d027bff1fb42f2e5e99cfc705f33db36_(page_1).jpg" target="_blank" rel="noopener noreferrer"><img loading="lazy" src="https://commons.wikimedia.org/wiki/Special:FilePath/Cabbage_Patch_Baby_Boy_Doll_-_DPLA_-_d027bff1fb42f2e5e99cfc705f33db36_%28page_1%29.jpg?width=720" alt="Cabbage Patch Kids baby boy doll circa 1983"><span class="art-copy"><strong>Cabbage Patch Baby Boy Doll</strong><small>Original Appalachian Artworks · c. 1983 · Missouri Historical Society / DPLA</small><em>An actual historical “Patch Kid” object, placed here beside the plant geometry so the KA–BA–GE Patch Kids word-chain is visually explicit.</em></span></a>
</div>
<p>Official Cabbage Patch Kids material reinforces the literal birth/patch vocabulary: BabyLand General describes Mother Cabbage, the Cabbage Patch and the witnessed “birth” of a hand-sculpted Cabbage Patch Kid. See <a href="https://cabbagepatchkids.com/pages/babyland-general-hospital" target="_blank" rel="noopener noreferrer">BabyLand General Hospital</a> and the brand’s <a href="https://cabbagepatchkids.com/pages/our-history" target="_blank" rel="noopener noreferrer">official history</a>.</p>

<p><strong>Lettuce → lattice</strong> then becomes more than a sound resemblance inside the model. It moves from the visible living body to the proposed hidden ordering framework beneath it. The lattice is not necessarily the flesh of the world; it is the structure around which the flesh can organise.</p>
<p>The phrase <strong>“lot of eyes”</strong> adds another layer. A lattice naturally produces repeated openings, crossings and nodes. Seen symbolically, each opening can be read as an <em>eye</em>. A large woven field therefore becomes a field of eyes: many local apertures or nodes belonging to one larger structure.</p>
<p>This joins directly to the earlier Watchers / many-eyes / stars / luminous-node branch. What had previously been treated as several related motifs can now be expressed as one growth sequence:</p>
<blockquote><strong>lattice → openings / eyes → local nodes / gates → material growth around the framework → living world.</strong></blockquote>
<p>The idea also changes the role of the three shells. The shells do not have to be solid pre-made containers. They can be <strong>growth bodies</strong>: matter accumulating, layering and turning around an older organising geometry. The recent 20-shard shell test separated two jobs that had previously been blurred together: <strong>reversal creates recurring gates, while attraction changes the turning or pitch</strong>. In this new biological analogy, the lattice supplies the recurring structure and the attractive interaction helps determine how growth winds around it.</p>
<div class="callout good"><strong>We are not simply made of the lattice. We are growth produced upon it.</strong><br>The KA–BA–GE is the living/material body; the lattice is the hidden ordering framework; the “eyes” are the repeated openings and nodes through which that framework becomes locally visible or active.</div>
<p>Read this way, cabbage, lettuce and lattice become successive views of one process: <strong>life enters matter, matter grows by repeated turning, and the turning reveals the hidden geometry that organises the living shell.</strong></p>
</section>
'''
              s = s.replace(marker, '</div>\n' + section + '\n<p><strong>Assistant note — Freemason/alchemical corpus test:</strong>', 1)
              f18.write_text(s, encoding='utf-8')

          # Assertions: one static copy, no dynamic KA-BA-GE copy remains.
          fs = f18.read_text(encoding='utf-8')
          xs = x13.read_text(encoding='utf-8')
          assert fs.count(f'id="{section_id}"') == 1
          assert section_id not in xs
          assert 'data-after="ladder-as-lattice-the-masonic-sky-projection"' not in xs
          PY
          git diff --check
      - name: Commit static page edit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cosmology_fragments/f18.txt cosmology_expansions/x13.txt
          git commit -m 'Make KA-BA-GE a separate static cosmology section'
          git push
