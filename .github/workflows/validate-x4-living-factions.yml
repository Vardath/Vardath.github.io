name: Validate X4 Living Factions extension
on:
  workflow_run:
    workflows: ["Package three X4 mods"]
    types: [completed]
  workflow_dispatch:
jobs:
  test:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check current extension, builder payroll and ZIP
        run: python downloads/x4-living-factions-builders/validate.py
