name: Full 3-4-5 Pyramid Benchmark

on:
  push:
    paths:
      - 'tools/benchmark_pyramid_codec.py'
      - '.github/workflows/pyramid-benchmark.yml'
      - 'data/phonetic-benchmark-languages.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pyramid benchmark
        run: python tools/benchmark_pyramid_codec.py
      - name: Publish benchmark result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Vardath@users.noreply.github.com'
          git add data/pyramid-benchmark-summary.json
          if git diff --cached --quiet; then
            echo 'No benchmark changes.'
          else
            git commit -m 'Update full 3-4-5 pyramid benchmark results'
            git pull --rebase origin main
            git push
          fi
