name: Clean current EXTRA research duplicates

on:
  push:
    branches: [main]
    paths:
      - 'research-staging/cleanup-extra-research-current.trigger'

permissions:
  contents: write

concurrency:
  group: extra-research-append
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate continuation tail
        shell: python
        run: |
          from pathlib import Path

          path = Path("book/EXTRA-RESEARCH.md")
          text = path.read_text(encoding="utf-8")

          good = "# SECTION 53C1 CHECKPOINT — EZEKIEL 33–36 COMPLETE"
          duplicate = "# SECTION 53 progress B2A — Ezekiel 21–24"

          good_i = text.find(good)
          dup_positions = []
          start = 0
          while True:
              i = text.find(duplicate, start)
              if i < 0:
                  break
              dup_positions.append(i)
              start = i + len(duplicate)

          if good_i < 0:
              raise SystemExit("Verified Ezekiel 33–36 checkpoint not found")
          if len(dup_positions) != 1:
              raise SystemExit(f"Expected exactly one duplicate B2A tail marker, found {len(dup_positions)}")

          dup_i = dup_positions[0]
          if dup_i <= good_i:
              raise SystemExit("Duplicate marker is not after the verified C1 checkpoint")

          # The duplicate B2A/B2B/B2C material was appended after the already-complete
          # C1 endpoint. Remove only that later tail. Unique refinements are appended
          # separately through the normal staged-research workflow.
          text = text[:dup_i].rstrip() + "\n"
          path.write_text(text, encoding="utf-8")

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f research-staging/cleanup-extra-research-current.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove duplicate Ezekiel continuation tail"
            git push
          fi
