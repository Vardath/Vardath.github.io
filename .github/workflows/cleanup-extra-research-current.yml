name: Clean current EXTRA research duplicates

on:
  push:
    branches: [main]
    paths:
      - 'research-staging/cleanup-extra-research-current.trigger'

permissions:
  contents: write

concurrency:
  group: extra-research-append
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove current duplicate research block
        shell: python
        run: |
          from pathlib import Path

          path = Path("book/EXTRA-RESEARCH.md")
          text = path.read_text(encoding="utf-8")

          marker = "# SECTION 53 progress B2b-1 — Ezekiel 25–28"
          next_marker = "# SECTION 53 progress B2b-2 — Ezekiel 29–32"

          positions = []
          start = 0
          while True:
              i = text.find(marker, start)
              if i < 0:
                  break
              positions.append(i)
              start = i + len(marker)

          if len(positions) != 2:
              raise SystemExit(f"Expected exactly two Ezekiel 25–28 blocks, found {len(positions)}")

          second = positions[1]
          after = text.find(next_marker, second + len(marker))
          if after < 0:
              raise SystemExit("Could not find Ezekiel 29–32 block after duplicate 25–28 block")

          # Preserve the first/full 25–28 block and the existing 29–32 block.
          text = text[:second] + text[after:]
          path.write_text(text, encoding="utf-8")

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f research-staging/cleanup-extra-research-current.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove duplicate Ezekiel 25-28 research block"
            git push
          fi
