name: Analyze Magic Language Groups

on:
  push:
    paths:
      - 'tools/analyze_345_magic_groups.py'
      - '.github/workflows/analyze-magic-language-groups.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run 3-4-5 magic bridge analysis
        env:
          MAGIC_345_PERMS: '500'
          MAGIC_345_WORDS: '12000'
        run: python tools/analyze_345_magic_groups.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/magic-language-groups.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish 3-4-5 magic bridge grouping results'
            git pull --rebase origin main
            git push
          fi
