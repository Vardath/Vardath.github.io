name: Build Original Language Web Store

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_original_language_web_store.py'
      - '.github/workflows/build-original-language-web-store.yml'
      - 'data/phonetic-original-language-dictionary.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build lightweight index and repo-backed word shards
        run: python tools/build_original_language_web_store.py
      - name: Commit web dictionary store
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Vardath@users.noreply.github.com'
          git add data/original-language-web/
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Build repo-backed original-language web dictionary'
            git pull --rebase origin main
            git push
          fi
