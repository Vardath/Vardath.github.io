name: Export Vardath Cosmology PDF

on:
  workflow_dispatch:
  push:
    paths:
      - "book/BOOK.md"
      - ".github/workflows/export-cosmology-pdf.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install weasyprint

      - name: Prepare book source and print CSS
        run: |
          mkdir -p export
          tail -n +7 book/BOOK.md > export/body.md
          cat > export/book.css <<'CSS'
          @page {
            size: 7in 10in;
            margin: 0.72in 0.66in 0.78in 0.72in;
            @bottom-center {
              content: counter(page);
              font-family: "DejaVu Sans", sans-serif;
              font-size: 8pt;
              color: #555;
            }
          }

          @page:first {
            @bottom-center { content: none; }
          }

          html { font-size: 10.25pt; }
          body {
            font-family: "DejaVu Serif", serif;
            line-height: 1.38;
            color: #111;
            text-align: justify;
            hyphens: auto;
          }

          header#title-block-header {
            text-align: center;
            margin-top: 2.4in;
            page-break-after: always;
          }

          header#title-block-header h1.title {
            font-size: 28pt;
            line-height: 1.12;
            margin: 0 0 0.55in 0;
          }

          header#title-block-header .author {
            font-size: 14pt;
            font-weight: normal;
          }

          nav#TOC {
            page-break-after: always;
            font-size: 9.1pt;
            line-height: 1.25;
          }

          nav#TOC > h1,
          nav#TOC > h2 {
            page-break-before: avoid;
          }

          nav#TOC ul {
            padding-left: 1.1em;
          }

          nav#TOC li {
            margin: 0.08em 0;
          }

          h1 {
            font-family: "DejaVu Sans", sans-serif;
            font-size: 18pt;
            line-height: 1.16;
            text-align: left;
            page-break-before: always;
            page-break-after: avoid;
            margin: 0 0 0.34in 0;
          }

          h2 {
            font-family: "DejaVu Sans", sans-serif;
            font-size: 13pt;
            line-height: 1.2;
            text-align: left;
            page-break-after: avoid;
            margin-top: 0.28in;
          }

          h3, h4, h5, h6 {
            font-family: "DejaVu Sans", sans-serif;
            text-align: left;
            page-break-after: avoid;
          }

          p {
            orphans: 3;
            widows: 3;
            margin: 0 0 0.72em 0;
          }

          blockquote {
            margin: 0.8em 0.35in;
            font-style: italic;
          }

          ul, ol {
            padding-left: 1.35em;
          }

          li {
            margin-bottom: 0.2em;
          }

          table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 7.5pt;
            line-height: 1.18;
            margin: 0.8em 0;
          }

          th, td {
            border: 0.5pt solid #777;
            padding: 3pt;
            vertical-align: top;
            overflow-wrap: anywhere;
            word-break: break-word;
          }

          pre, code {
            font-family: "DejaVu Sans Mono", monospace;
            font-size: 8.2pt;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
          }

          hr {
            border: none;
            border-top: 0.5pt solid #aaa;
            margin: 1.2em 0;
          }

          a {
            color: inherit;
            text-decoration: none;
          }
          CSS

      - name: Convert Markdown to 7x10 PDF
        run: |
          pandoc export/body.md             --from=gfm             --to=html5             --standalone             --toc             --toc-depth=2             --metadata title="Vardath Cosmology: A Big May Bee"             --metadata author="Stephen Michael Hawton / Vardath"             --css=export/book.css             --output=export/book.html
          weasyprint export/book.html export/Vardath-Cosmology-A-Big-May-Bee-FRESH.pdf

      - name: Package fresh manuscript
        run: |
          cp book/BOOK.md export/Vardath-Cosmology-A-Big-May-Bee-FRESH.md

      - name: Upload fresh reading copy
        uses: actions/upload-artifact@v4
        with:
          name: vardath-cosmology-fresh-reading-copy
          path: |
            export/Vardath-Cosmology-A-Big-May-Bee-FRESH.pdf
            export/Vardath-Cosmology-A-Big-May-Bee-FRESH.md
          retention-days: 14
