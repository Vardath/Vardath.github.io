name: Analyze Phonetic Groups

on:
  push:
    paths:
      - '.github/workflows/analyze-phonetic-groups.yml'
      - 'tools/analyze_phonetic_groups.py'
      - 'data/phonetic-benchmark-languages.csv'
      - 'data/phonetic-benchmark-pairs.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare site groups with Glottolog
        run: python tools/analyze_phonetic_groups.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Vardath@users.noreply.github.com'
          git add data/phonetic-group-comparison.json data/phonetic-group-comparison.md
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Analyze phonetic groups against Glottolog'
            git pull --rebase origin main
            git push
          fi
