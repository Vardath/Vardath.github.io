name: Clean ARK ARC SKY source note once
on:
  push:
    paths:
      - '.github/workflows/clean-ark-arc-source-note-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/clean_ark_arc_source_note_once.py
      - run: git diff --check
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add cosmology_fragments/f18.txt
          git commit -m "Keep ARK ARC SKY evidence framing in Assistant Notes"
          git push
