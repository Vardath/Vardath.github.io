name: Galactic Occupations and native payment checks
on:
  push:
    paths:
      - 'downloads/x4-galactic-occupations/**'
      - 'downloads/x4-kopis-production-cheat/**'
      - '.github/workflows/validate-x4-galactic-occupations.yml'
  pull_request:
    paths:
      - 'downloads/x4-galactic-occupations/**'
      - 'downloads/x4-kopis-production-cheat/**'
      - '.github/workflows/validate-x4-galactic-occupations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: XML, commands, references and installable ZIP (no X4 runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Revalidate the freshly repackaged 0.4.8 archive after the 11 November hotfix.\n      - name: Install XML patch test dependency
        run: python -m pip install 'lxml>=5,<7'
      - run: python downloads/x4-galactic-occupations/tools/validate.py --zip downloads/x4-galactic-occupations/Galactic_Occupations_0.4.8_DEV.zip --report /tmp/galactic-occupations-static-results.json
      - name: Reported scope, boarding, survey and payment source guards
        run: python downloads/x4-galactic-occupations/tools/tests/source_contracts.py
      - name: Execute crystal inventory accounting contracts (mock native actions)
        run: python downloads/x4-galactic-occupations/tools/tests/inventory_contracts.py
      - name: Execute hacker tool accounting and safety contracts
        run: python downloads/x4-galactic-occupations/tools/tests/hacker_contracts.py
      - name: Check reported menu and crystal recovery contracts
        run: python downloads/x4-galactic-occupations/tools/tests/runtime_recovery_contracts.py
      - name: Execute null-cache and supplied-log contracts
        run: python downloads/x4-galactic-occupations/tools/tests/debug7_contracts.py
      - name: Execute resource depletion, sale accounting and interruption contracts
        run: python downloads/x4-galactic-occupations/tools/tests/crystal_commerce_contracts.py
      - name: Execute supplied-log travel, startup and compatibility recovery contracts
        run: python downloads/x4-galactic-occupations/tools/tests/log8_recovery_contracts.py
      - name: Execute taxi/tour departure and unpaid-fare recovery contracts
        run: python downloads/x4-galactic-occupations/tools/tests/passenger_completion_contracts.py
      - name: Execute native dispatch, booked-station and galaxy-routing contracts
        run: python downloads/x4-galactic-occupations/tools/tests/log9_docking_contracts.py
      - name: Execute crew counter visits, finite merchant transfers and service invoices
        run: |
          python downloads/x4-galactic-occupations/tools/tests/crystal_retail_contracts.py
          python downloads/x4-galactic-occupations/tools/tests/service_payment_contracts.py
      - name: Execute off-screen broker, native passenger roster and room recovery contracts
        run: python downloads/x4-galactic-occupations/tools/tests/log11_service_contracts.py
      - name: Execute paid counter visit and independent crew-return recovery contracts
        run: python downloads/x4-galactic-occupations/tools/tests/log12_return_contracts.py
      - name: Execute cancellation grace, interruption safety and twenty-minute crew recalls
        run: python downloads/x4-galactic-occupations/tools/tests/lifecycle_contracts.py
      - name: Execute guarded spacesuit exit and Astrid braking boundaries
        run: python downloads/x4-galactic-occupations/tools/tests/spacesuit_contracts.py
      - name: Execute signal surveys, native benefits and disconnected passengers
        run: python downloads/x4-galactic-occupations/tools/tests/survey_contracts.py
      - name: Execute changed-role crew recovery, real native movement boundary and scan publication queue
        run: |
          python downloads/x4-galactic-occupations/tools/tests/role_return_contracts.py
          python downloads/x4-galactic-occupations/tools/tests/survey_publication_contracts.py
      - name: Execute native mission identifier and guarded station request contracts
        run: python downloads/x4-galactic-occupations/tools/tests/native_mission_contracts.py
      - name: Execute cold-start registry, native loadout type and optional subscription contracts
        run: python downloads/x4-galactic-occupations/tools/tests/cold_start_contracts.py
      - name: Execute ten-stop default and one-hour tour timeout/grace contracts
        run: python downloads/x4-galactic-occupations/tools/tests/tour_timeout_contracts.py
      - name: Execute empty native workforce-slot selection contracts
        run: python downloads/x4-galactic-occupations/tools/tests/npc_population_contracts.py
      - name: Execute native office, remote contact and crystal worker scheduling contracts
        run: python downloads/x4-galactic-occupations/tools/tests/station_services_contracts.py
      - name: Execute L and XL passenger transporter and inactive-physics failure contracts
        run: python downloads/x4-galactic-occupations/tools/tests/capital_transport_contracts.py
      - name: Install Lua 5.1 for X4-compatible syntax checks
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Execute addon UI contract tests (mock widgets; no X4 runtime)
        run: |
          luac5.1 -p downloads/x4-galactic-occupations/vardath_galactic_occupations/ui/vgo_spacesuit.lua
          luac5.1 -p downloads/x4-galactic-occupations/vardath_galactic_occupations/ui/vgo_hacker.lua
          luac5.1 -p downloads/x4-galactic-occupations/vardath_galactic_occupations/ui/vgo_turret_modes.lua
          luac5.1 -p downloads/x4-galactic-occupations/vardath_galactic_occupations/ui/vardath_income_ledger.lua
          luac5.1 -p downloads/x4-living-factions-builders/vardath_living_factions_builders/ui/vardath_income_ledger.lua
          lua5.1 downloads/x4-galactic-occupations/tools/tests/ui_contracts.lua downloads/x4-galactic-occupations/vardath_galactic_occupations
          lua5.1 downloads/x4-galactic-occupations/tools/tests/hacker_ui_contracts.lua downloads/x4-galactic-occupations/vardath_galactic_occupations
          lua5.1 downloads/x4-galactic-occupations/tools/tests/spacesuit_ui_contracts.lua downloads/x4-galactic-occupations/vardath_galactic_occupations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Galactic-Occupations-static-validation
          path: /tmp/galactic-occupations-static-results.json
