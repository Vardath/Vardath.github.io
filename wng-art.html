<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WNG Art — Vardath</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080b10;
  --panel:#111821;
  --line:#283544;
  --text:#eef4fb;
  --muted:#9cabbc;
  --link:#70d9ff;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
header{
  padding:22px 16px 18px;
  border-bottom:1px solid var(--line);
  background:#0b1017;
}
.wrap{max-width:1700px;margin:0 auto}
h1{margin:5px 0 6px;font-size:clamp(30px,6vw,52px)}
p{margin:0;color:var(--muted)}
a{color:var(--link)}
#count{margin-top:10px;font-weight:700;color:var(--text)}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
  padding:16px;
  max-width:1700px;
  margin:0 auto;
}
.card{
  display:block;
  min-width:0;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel);
  color:var(--text);
  text-decoration:none;
}
.thumb{
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    linear-gradient(45deg,#141d27 25%,transparent 25%) 0 0/20px 20px,
    linear-gradient(45deg,transparent 75%,#141d27 75%) 0 0/20px 20px,
    linear-gradient(45deg,transparent 75%,#141d27 75%) 10px -10px/20px 20px,
    linear-gradient(45deg,#141d27 25%,#0d141c 25%) 10px -10px/20px 20px;
}
.thumb img{
  display:block;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}
.meta{padding:8px 9px 10px}
.name{
  font-size:12px;
  font-weight:700;
  overflow-wrap:anywhere;
}
.path{
  margin-top:4px;
  color:var(--muted);
  font-size:9px;
  line-height:1.3;
  overflow-wrap:anywhere;
}
.error{
  max-width:1100px;
  margin:30px auto;
  padding:16px;
  border:1px solid #793b3b;
  border-radius:10px;
  background:#1a1111;
}
@media(max-width:620px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a href="./">← Vardath</a>
    <h1>Wraith &amp; Nanite Gravtech — Art</h1>
    <p>Every PNG currently stored in the public WNG 1.6 mod repository. Tap any thumbnail to open that exact art file directly from the mod.</p>
    <div id="count">Loading all mod art…</div>
  </div>
</header>

<main id="gallery" class="grid" aria-live="polite"></main>

<script>
const OWNER='Vardath';
const REPO='Wraith-Nanite-Gravtech-1.6';
const BRANCH='main';
const TREE='https://api.github.com/repos/'+OWNER+'/'+REPO+'/git/trees/'+BRANCH+'?recursive=1';
const RAW='https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/'+BRANCH+'/';

const gallery=document.getElementById('gallery');
const count=document.getElementById('count');

function esc(s){
  return String(s)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;');
}

function rawUrl(path,sha){
  const encoded=path.split('/').map(encodeURIComponent).join('/');
  return RAW+encoded+'?v='+encodeURIComponent(sha);
}

async function loadAllArt(){
  const response=await fetch(TREE,{cache:'no-store'});
  if(!response.ok) throw new Error('GitHub tree request failed: '+response.status);

  const data=await response.json();
  if(data.truncated) throw new Error('GitHub returned a truncated repository tree.');

  const art=data.tree
    .filter(item=>item.type==='blob' && /\.png$/i.test(item.path))
    .sort((a,b)=>a.path.localeCompare(b.path));

  count.textContent=art.length+' PNG art files — live from WNG main';

  const fragment=document.createDocumentFragment();

  for(const item of art){
    const url=rawUrl(item.path,item.sha);
    const card=document.createElement('a');
    card.className='card';
    card.href=url;
    card.target='_blank';
    card.rel='noopener';
    card.title=item.path;

    const filename=item.path.split('/').pop();

    card.innerHTML=
      '<div class="thumb">'+
        '<img loading="lazy" decoding="async" src="'+url+'" alt="'+esc(filename)+'">'+
      '</div>'+
      '<div class="meta">'+
        '<div class="name">'+esc(filename)+'</div>'+
        '<div class="path">'+esc(item.path)+'</div>'+
      '</div>';

    fragment.appendChild(card);
  }

  gallery.replaceChildren(fragment);
}

loadAllArt().catch(error=>{
  count.textContent='Could not load the mod art list.';
  gallery.className='error';
  gallery.innerHTML=
    '<strong>Gallery load failed.</strong><br>'+
    esc(error.message)+
    '<br><br><a href="https://github.com/Vardath/Wraith-Nanite-Gravtech-1.6/tree/main/Textures">Open the WNG art in GitHub</a>';
});
</script>
</body>
</html>
