<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WNG Art Gallery — Vardath</title><style>:root{--bg:#080c12;--panel:#111923;--line:#26384e;--text:#eef6ff;--muted:#9fb1c5;--cyan:#58d7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1500px;margin:auto;padding:0 16px}header{padding:26px 0 18px;border-bottom:1px solid var(--line);background:#0b111a}a{color:var(--cyan)}h1{margin:.2em 0;font-size:clamp(28px,6vw,48px)}.sub{color:var(--muted);max-width:950px}.tools{position:sticky;top:0;z-index:5;background:#080c12ee;backdrop-filter:blur(8px);padding:10px 0;border-bottom:1px solid var(--line)}.toolrow{display:grid;grid-template-columns:2fr 1fr auto;gap:8px}input,select{width:100%;background:#111923;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}.count{align-self:center;color:var(--muted);white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:18px 0 50px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0;cursor:pointer}.thumb{aspect-ratio:1/1;background:repeating-conic-gradient(#1a2532 0 25%,#111923 0 50%) 50%/20px 20px;display:flex;align-items:center;justify-content:center}.thumb img{display:block;max-width:100%;max-height:100%;object-fit:contain}.meta{padding:8px}.name{font-size:12px;font-weight:700;overflow-wrap:anywhere}.path{font-size:9px;color:var(--muted);overflow-wrap:anywhere;margin-top:3px}.cat{font-size:9px;color:var(--cyan);margin-top:4px}dialog{width:min(96vw,1200px);max-height:95vh;background:#080c12;color:#fff;border:1px solid var(--line);border-radius:12px;padding:0}dialog::backdrop{background:#000c}.dlgbar{display:flex;justify-content:space-between;gap:12px;padding:10px;position:sticky;top:0;background:#0b111a;z-index:2}.dlgimg{display:block;max-width:100%;height:auto;margin:auto}.close{background:#172333;border:1px solid var(--line);color:#fff;border-radius:8px;padding:8px 12px}@media(max-width:650px){.toolrow{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><header><div class="wrap"><a href="./">← Vardath</a><h1>Wraith &amp; Nanite Gravtech — Complete Art Gallery</h1><div class="sub">Every PNG below is the actual game asset loaded directly from the public WNG 1.6 repository. No contact sheets, no copied gallery images, no GitHub folder viewer. Tap any image to enlarge it.</div></div></header><div class="tools"><div class="wrap toolrow"><input id="q" placeholder="Search filename or path…"><select id="cat"><option value="">All art</option></select><div class="count" id="count">Loading art…</div></div></div><main class="wrap"><section id="grid" class="grid"></section></main><dialog id="viewer"><div class="dlgbar"><span id="vtitle"></span><button class="close" onclick="viewer.close()">Close</button></div><img id="vimg" class="dlgimg" alt=""></dialog><script>const API='https://api.github.com/repos/Vardath/Wraith-Nanite-Gravtech-1.6/git/trees/main?recursive=1',RAW='https://raw.githubusercontent.com/Vardath/Wraith-Nanite-Gravtech-1.6/main/';const grid=document.getElementById('grid'),q=document.getElementById('q'),cat=document.getElementById('cat'),count=document.getElementById('count'),viewer=document.getElementById('viewer'),vimg=document.getElementById('vimg'),vtitle=document.getElementById('vtitle');let assets=[];function category(p){if(p==='About/Preview.png')return'Mod preview';if(p.startsWith('Textures/UI/'))return'UI';if(p.startsWith('Textures/World/'))return'World';if(p.startsWith('Textures/Terrain/'))return'Terrain';if(p.startsWith('Textures/Things/Projectile/'))return'Projectiles';if(p.startsWith('Textures/Things/Item/'))return'Items, weapons & implants';if(p.startsWith('Textures/Things/Building/Wraith/Gravship/'))return'Wraith gravship';if(p.startsWith('Textures/Things/Building/Wraith/'))return'Wraith buildings';if(p.startsWith('Textures/Things/Building/Precursor/Gravship/'))return'Asuran gravship';if(p.startsWith('Textures/Things/Building/Precursor/'))return'Asuran / Precursor buildings';if(p.startsWith('Textures/Things/Building/Replicator/'))return'Replicator buildings';if(p.startsWith('Textures/Things/Pawn/Replicator/'))return'Replicator pawns';if(p.startsWith('Textures/Things/Pawn/Humanlike/'))return'Humanlike / apparel';return'Other'}function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function raw(p){return RAW+p.split('/').map(encodeURIComponent).join('/')}function render(){const s=q.value.toLowerCase(),c=cat.value,list=assets.filter(a=>(!c||a.c===c)&&(!s||a.p.toLowerCase().includes(s)));count.textContent=list.length+' / '+assets.length+' images';grid.innerHTML='';for(const a of list){const url=raw(a.p),card=document.createElement('article');card.className='card';card.innerHTML='<div class="thumb"><img loading="lazy" src="'+url+'" alt="'+esc(a.n)+'"></div><div class="meta"><div class="name">'+esc(a.n)+'</div><div class="path">'+esc(a.p)+'</div><div class="cat">'+esc(a.c)+'</div></div>';card.onclick=()=>{vimg.src=url;vtitle.textContent=a.p;viewer.showModal()};grid.appendChild(card)}}fetch(API,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('GitHub '+r.status);return r.json()}).then(d=>{assets=d.tree.filter(x=>x.type==='blob'&&((x.path.startsWith('Textures/')&&/\.png$/i.test(x.path))||x.path==='About/Preview.png')).map(x=>({p:x.path,n:x.path.split('/').pop(),c:category(x.path)})).sort((a,b)=>a.c.localeCompare(b.c)||a.p.localeCompare(b.p));[...new Set(assets.map(a=>a.c))].sort().forEach(c=>cat.add(new Option(c,c)));render()}).catch(e=>{count.textContent='Could not load art';grid.innerHTML='<p>'+esc(String(e))+'</p>'});q.oninput=render;cat.onchange=render;viewer.onclick=e=>{if(e.target===viewer)viewer.close()};</script></body></html>
